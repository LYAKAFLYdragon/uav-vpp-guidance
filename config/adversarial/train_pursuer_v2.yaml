# Adversarial Pursuer Fine-Tuning Configuration v2
# Phase 2: Fine-tune pursuer against a frozen trained target agent.
#
# Goal: make the pursuer more aggressive and closing-oriented so that it can
# capture an evasive RL target instead of staying conservative.
#
# Key changes vs v1:
#   - Enable w_closing (was 0.0) to reward range-rate reduction.
#   - Reduce w_safety (2.0 -> 1.0) so the policy accepts some risk to close in.
#   - Increase w_geometry / w_angle to prioritize alignment.
#   - Add w_adversarial_bonus for closing on a maneuvering target.
#
# Usage:
#   python scripts/train_adversarial_pursuer.py --config config/adversarial/train_pursuer_v2.yaml

includes:
  - ../env.yaml
  - ../ppo.yaml
  - ../guidance.yaml
  - ../reward.yaml

experiment:
  name: adversarial_pursuer_finetune_v2
  seed: 42

# Training budget
training:
  total_timesteps: 300000
  eval_interval: 10000
  save_interval: 50000
  smoke_timesteps: 5000

# PPO hyperparameters (reduced LR for fine-tuning)
ppo:
  learning_rate: 1.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  entropy_coef: 1.0e-3
  rollout_steps: 1024
  minibatch_size: 256
  update_epochs: 10
  value_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu
  total_timesteps: 300000

policy:
  hidden_sizes: [128, 128]
  activation: tanh
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

# Target policy network (must match target_agent_ppo checkpoint)
target_policy:
  hidden_sizes: [128, 128]
  activation: tanh
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

# Reward overrides for adversarial pursuit (merged into the included reward block)
reward:
  w_range: 0.5
  w_angle: 1.2              # Increased vs default 0.8: tighter alignment
  w_geometry: 1.5           # Higher-level geometry emphasis (kept for documentation)
  w_energy: 0.2
  w_safety: 1.0             # Reduced vs default 2.0: accept more risk to close
  w_saturation: 1.0
  w_smooth: 0.1
  w_turn_rate: 0.5
  w_closing: 0.3            # NEW/ENABLED: reward closing velocity
  w_alive: 0.0
  w_overshoot: 0.0
  w_boundary: 0.0
  w_adversarial_bonus: 0.5  # NEW: bonus for closing on a maneuvering target
  terminal_success: 200.0
  terminal_failure: -200.0
  terminal_crash: -300.0

# Scenario sampler for initial conditions
scenario_sampler:
  enabled: true
  source: registry_set
  set: smoke_test
  seed: 42

# Paths to pre-trained checkpoints
pursuer_checkpoint: "outputs/experiments/no_prediction_vpp_ppo_seed0/checkpoints/best.pt"
target_checkpoint: "outputs/adversarial/training/target_agent_ppo_v2/checkpoints/best.pt"

# Output directory
output_dir: "outputs/adversarial/training/pursuer_adversarial_v2"

# Reward debug logging (Task B deliverable)
adversarial_debug:
  log_rewards: true
  reward_log_path: "outputs/adversarial/debug/reward_terms.csv"
