# No-VPP pilot variant of adversarial pursuer fine-tuning config.
# Combines zero virtual-point offset with reduced pilot budget.
includes:
  - train_pursuer_v2_no_vpp.yaml

# Reduced budget for the pilot.
training:
  total_timesteps: 100000
  eval_interval: 10000
  save_interval: 50000

# Output directory for the pilot run.
output_dir: "outputs/adversarial_curriculum_pilot/pursuer_no_vpp_pilot"

# Reward debug logging (Task B deliverable)
adversarial_debug:
  log_rewards: true
  reward_log_path: "outputs/adversarial/debug/reward_terms_pilot.csv"
