# Aggressive VPP pilot variant for adversarial fine-tuning.
# Addresses VPP Stage 2 action saturation by:
#   - reducing VPP offset ranges so +1 actions do not place the VP unrealistically far,
#   - increasing closing/success rewards and reducing safety penalty,
#   - raising entropy to prevent policy collapse.
includes:
  - train_pursuer_v2_pilot.yaml

experiment:
  name: adversarial_pursuer_finetune_v2_pilot_aggressive

# Tighter VPP workspace: prevents the policy from hiding behind huge offsets
virtual_point:
  d_long_range: [-500.0, 500.0]
  d_lat_range: [-300.0, 300.0]
  d_vert_range: [-200.0, 200.0]
  smoothing_alpha: 0.3
  dynamics_aware: true
  lookahead_steps: 5

# More aggressive reward: close first, stay safe second
reward:
  w_range: 0.2
  w_angle: 1.0
  w_geometry: 1.0
  w_energy: 0.1
  w_safety: 0.3        # reduced from 1.0
  w_saturation: 1.0
  w_smooth: 0.05
  w_turn_rate: 0.3
  w_closing: 1.0       # increased from 0.3
  w_alive: 0.0
  w_overshoot: 0.0
  w_boundary: 0.0
  w_adversarial_bonus: 0.5
  terminal_success: 500.0   # increased from 200
  terminal_failure: -200.0
  terminal_crash: -300.0

# Higher entropy to avoid saturation/collapse
ppo:
  learning_rate: 1.0e-4
  entropy_coef: 1.0e-2   # increased from 1e-3

output_dir: "outputs/adversarial_curriculum_pilot/pursuer_pilot_aggressive"
