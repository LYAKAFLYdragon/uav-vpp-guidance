# Target stability ablation v2.
# Goal: train an RL evader that stays inside the combat arena while avoiding
# capture. Uses neutral/challenging geometries (head-on, crossing, tail-chase)
# and a strong proximity penalty so the target learns to dodge rather than run
# straight out of bounds.
includes:
  - train_target_v2.yaml

experiment:
  name: adversarial_target_stability_ablation_v2
  seed: 0

# Small-budget ablation
training:
  total_timesteps: 100000
  eval_interval: 10000
  save_interval: 10000
  smoke_timesteps: 5000

# Conservative flight envelope to reduce JSBSim divergence
limits:
  nz_min: -1.5
  nz_max: 3.5
  roll_rate_min: -0.8
  roll_rate_max: 0.8
  throttle_min: 0.0
  throttle_max: 1.0

# Reward: survival/energy first, strong stay-in-bounds penalty, no run-away bonus
target_reward:
  w_survival: 0.10
  w_escaping: 0.0         # removed: encourages leaving the arena
  w_energy: 0.10
  w_range: 0.10
  w_maneuver: 0.0        # removed: aggressive turning caused crashes
  w_proximity: 1.0       # penalty for exceeding proximity_range_m
  proximity_range_m: 5000.0
  maneuver_ref_rate: 0.3
  terminal_captured: -500.0
  terminal_crash: -500.0
  terminal_oob: -200.0   # penalty for leaving the arena
  terminal_timeout: 200.0

# Slower learning for stability
target_ppo:
  learning_rate: 1.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  entropy_coef: 1.0e-3
  rollout_steps: 1024
  minibatch_size: 256
  update_epochs: 10
  value_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu
  total_timesteps: 100000

# Neutral/challenging scenarios only. Fleeing scenarios are excluded because the
# target can too easily escape out-of-bounds, which does not teach in-arena
# evasion needed for the pursuer fine-tuning stage.
scenario_sampler:
  enabled: true
  source: explicit_list
  names:
    - smoke_head_on
    - smoke_crossing_left
    - smoke_crossing_right
    - smoke_tail_chase
    - smoke_offset_attack
  seed: 0

# Frozen Stage-1 VPP pursuer
pursuer_checkpoint: "outputs/adversarial_curriculum_pilot/vpp_s0/stage1/checkpoints/best.pt"

output_dir: "outputs/adversarial_curriculum_pilot/target_stability_ablation_v2"

adversarial_debug:
  log_rewards: true
  reward_log_path: "outputs/adversarial/debug/reward_terms_ablation_v2.csv"
