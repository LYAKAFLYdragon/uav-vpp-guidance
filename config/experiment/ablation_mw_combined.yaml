# Ablation: combine bank-angle protection and stronger altitude-hold gain.
includes:
  - task_multi_waypoint.yaml

low_level_controller:
  type: enhanced
  enable_bank_angle_protection: true
  max_bank_rad: 0.9599310885968813   # 55 deg
  bank_violation_threshold: 25
  bank_protection_nz_increment: 0.5
  altitude_hold_gain: 0.01
