# Air-Combat MVP — pilot scenario config (Stage 1: one-way kill).
# Drives the rule-policy validation experiment (scripts/validate_mvp_air_combat.py).
# Runs on the simple point-mass backend (no JSBSim dependency) per Requirement 9.3.
#
# COORDINATE CONVENTION (IMPORTANT):
#   The host env (SimplePointMassEnv / CloseRangeTrackingEnv simple backend) uses
#   NEU ordering: position_m = [north, east, up]  ->  altitude is the 3rd component.
#   Existing repo configs confirm this (see close_range_curriculum_stage1.yaml,
#   which puts 5000 in the 3rd slot for a 5000 m altitude).
#
#   Design §4.5 / Requirement 5.2 wrote ego position_m as [0, 5000, 0], assuming the
#   JSBSim [north, up, east] ordering (altitude=index 1). To preserve the INTENT of
#   Req 5.2 ("ego initial altitude 5000 m, speed 250, heading 0") AND remain physically
#   correct in this env, ego position_m below is written in the actual NEU convention:
#   [0.0, 0.0, 5000.0]  (north=0, east=0, up=5000). This keeps Task 17/19 validation in
#   a sane altitude regime.
includes:
  - ../env.yaml          # reuse base env / guidance / limits
  - ../ppo.yaml

experiment:
  name: air_combat_mvp_pilot
  seed: 0
  mode: validate
  output_root: outputs

env:
  backend: simple                  # pilot uses the simple backend (no JSBSim, Req 9.3)
  use_jsbsim: false
  max_high_level_steps: 400        # 400 steps * 0.2 s = 80 s (Req 5.1)
  high_level_dt: 0.2
  decision_freq: 5

scenario:
  # Ego initial state (NEU [north, east, up]; altitude = 3rd component = 5000 m). Req 5.2
  ego_init:
    position_m: [0.0, 0.0, 5000.0]
    velocity_mps: 250.0
    heading_deg: 0.0
  # Target randomization ranges, sampled on reset (Req 5.3 / 5.4).
  # range_m / azimuth_deg / elevation_deg are [min, max] ranges.
  target_init:
    range_m: [3000.0, 5000.0]
    azimuth_deg: [-30.0, 30.0]
    elevation_deg: [-10.0, 10.0]
    velocity_mps: 250.0
    heading_deg: 180.0             # head-on
  # Scenario boundaries (out_of_bounds termination uses these; Req 3.11).
  bounds:
    min_altitude_m: 1000.0
    max_altitude_m: 9000.0
    max_range_m: 12000.0

air_combat:
  missile_config:
    ego:
      enabled: true                # ego missile enabled (Req 5.5)
      # Standard true-PN guidance (a = K * cross(omega, V_missile)) restores
      # effective km-range guidance. Tuned to clear validation pass criteria
      # (launch>90%, hit>80%, avg_kill_time<30s) -> achieved 100%/100%/~4.3s.
      # nav_constant=5.0: standard PN navigation constant (typical range 3-5).
      # kill_radius_m=120.0: enlarged lethal radius acts as a proximity-fuze /
      #   discrete-step margin. At ~750 m/s closing speed and high_level_dt=0.2 s
      #   the missile advances ~150 m per step, so check_hit (sampled once per
      #   step) can "tunnel" past a small kill sphere between samples; 120 m
      #   reliably captures these near-misses without being physically unreasonable
      #   for a guided AAM proximity fuze.
      nav_constant: 5.0
      kill_radius_m: 120.0
    target:
      enabled: false               # target missile disabled (one-way kill, Stage 1; Req 5.5)
  radar_config:                    # fire-control radar config (Req 5.6)
    max_range_m: 10000.0
    azimuth_fov_deg: 60.0
    elevation_fov_deg: 30.0
    lock_time_steps: 3
  reward:
    use_sparse: true               # enable sparse reward (Req 5.7)
    relabelling:
      enabled: true                # enable gaussian trajectory relabelling
      window: 50                   # relabelling window = 50 (Req 5.7)
