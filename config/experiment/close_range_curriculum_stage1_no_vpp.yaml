# Stage 1 No-VPP variant of the adversarial curriculum.
# Uses the same easy opponent and head-on scenarios as the VPP stage 1, but
# forces the virtual pursuit point offset to zero so the pursuer tracks the
# target directly (No-VPP baseline).
includes:
  - ../env_bandit.yaml
  - ../ppo.yaml
  - ../reward.yaml
  - ../success_criteria/loose.yaml

experiment:
  name: close_range_curriculum_stage1_no_vpp
  seed: 0
  mode: train
  output_root: outputs

env:
  backend: jsbsim
  use_jsbsim: true
  max_high_level_steps: 100

  # Easy opponent: default CAC (close-in behavior, easier to exploit).
  bandit:
    controller_type: close_air_combat
    close_air_combat:
      guidance_config:
        desired_range_lag: 800.0
        desired_range_lead: 5000.0
        lag_distance: 500.0

# Domain randomization perturbs headings/positions/speeds around the base scenario.
domain_randomization:
  scale: 1.0
  position_noise_fraction: 0.10
  velocity_noise_fraction: 0.10
  heading_noise_deg: 15.0

# Only head-on scenarios initially (highest success probability for the agent).
scenarios:
  head_on:
    name: head_on
    description: "Head-on encounter with random heading perturbations."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0

virtual_point:
  enabled: true
  mode: zero_offset
  anchor_mode: current_target
  return_info: true
