# Stage 2: medium opponent + head-on & favorable + default success criteria.
includes:
  - ../env_bandit.yaml
  - ../ppo.yaml
  - ../reward.yaml
  - ../success_criteria/medium.yaml

experiment:
  name: close_range_curriculum_stage2
  seed: 0
  mode: train
  output_root: outputs

env:
  backend: jsbsim
  use_jsbsim: true
  max_high_level_steps: 100

  # Medium opponent: tuned CAC that keeps larger separation.
  bandit:
    controller_type: close_air_combat
    close_air_combat:
      guidance_config:
        desired_range_lag: 5000.0
        desired_range_lead: 12000.0
        lag_distance: 3000.0

domain_randomization:
  scale: 1.0
  position_noise_fraction: 0.10
  velocity_noise_fraction: 0.10
  heading_noise_deg: 15.0

scenarios:
  head_on:
    name: head_on
    description: "Head-on encounter."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
  favorable:
    name: favorable
    description: "Ego starts behind the target."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
