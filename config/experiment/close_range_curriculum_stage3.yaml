# Stage 3: hard opponent + all four canonical scenarios + strict success criteria.
includes:
  - ../env_bandit.yaml
  - ../ppo.yaml
  - ../reward.yaml
  - ../success_criteria/strict.yaml

experiment:
  name: close_range_curriculum_stage3
  seed: 0
  mode: train
  output_root: outputs

env:
  backend: jsbsim
  use_jsbsim: true
  max_high_level_steps: 100

  # Hard opponent: maneuver-library expert system.
  bandit:
    controller_type: maneuver_library

domain_randomization:
  scale: 1.0
  position_noise_fraction: 0.10
  velocity_noise_fraction: 0.10
  heading_noise_deg: 15.0

scenarios:
  favorable:
    name: favorable
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
  head_on:
    name: head_on
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
  challenging:
    name: challenging
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
  neutral:
    name: neutral
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
