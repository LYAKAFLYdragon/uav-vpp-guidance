# Three-stage opponent curriculum v5 for close-range dogfight RL.
#
# Goal: make Stage 3 non-head-on scenarios solvable while still hard enough
# that VPP's predictive aim outperforms No-VPP's reactive LOS pursuit.
#
# Lessons from v2/v3/v4:
#   - v2/v3/v4 all stalled both methods at Stage 2 because non-head-on
#     scenarios (favorable/challenging/neutral) stayed at 0% SR.
#   - Head-on SR showed a reliable VPP > No-VPP gap (90% vs 65-80%).
#
# Changes vs v4:
#   - Stage 3 uses its own scenario set with closer initial geometry and a
#     slight pursuer speed advantage, making tail-chase/side-by-side solvable.
#   - All other Stage 3 settings (maneuver library, predictability) unchanged.
#
# Stage 1: easy opponent (CAC default) + head-on only + loose success criteria.
# Stage 2: medium opponent (CAC tuned v2) + head-on & favorable + default criteria.
# Stage 3: hard but predictable maneuver-library opponent + all scenarios + strict criteria.
includes:
  - ../env_bandit.yaml
  - ../ppo.yaml
  - ../reward.yaml

experiment:
  name: close_range_curriculum_v5
  seed: 0
  mode: train
  output_root: outputs

env:
  backend: jsbsim
  use_jsbsim: true
  max_high_level_steps: 150

domain_randomization:
  scale: 1.0
  position_noise_fraction: 0.10
  velocity_noise_fraction: 0.10
  heading_noise_deg: 15.0

scenarios:
  # Shared easy/medium scenarios (Stages 1 and 2)
  favorable:
    name: favorable
    description: "Ego starts behind the target."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
  head_on:
    name: head_on
    description: "Head-on encounter."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
  challenging:
    name: challenging
    description: "Ego starts in front of the target (tail-chase for bandit)."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
  neutral:
    name: neutral
    description: "Both aircraft fly in the same direction, side-by-side."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0

  # Stage-3 specific: closer geometry + slight pursuer speed advantage.
  favorable_s3:
    name: favorable_s3
    description: "Ego starts behind the target at close range (pursuer faster)."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 280.0
      heading_deg: 0.0
    target_init:
      position_m: [1000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
  head_on_s3:
    name: head_on_s3
    description: "Head-on encounter (pursuer faster)."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 280.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0
  challenging_s3:
    name: challenging_s3
    description: "Ego starts in front at close range (pursuer faster)."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 280.0
      heading_deg: 180.0
    target_init:
      position_m: [1000.0, 0.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 0.0
  neutral_s3:
    name: neutral_s3
    description: "Side-by-side at close range (pursuer faster)."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 280.0
      heading_deg: 180.0
    target_init:
      position_m: [1000.0, 500.0, 5000.0]
      velocity_mps: 250.0
      heading_deg: 180.0

curriculum:
  stage_gate_sr: 0.40
  stages:
    - progress_end: 0.33
      scenario_names:
        - head_on
      description: "Easy: CAC default, loose success criteria"
      bandit_config:
        enabled: true
        controller_type: close_air_combat
        close_air_combat:
          project_root: "E:/CloseAirCombat_control"
          high_level_model: "baseline_results/checkpoints/proposed_ppo.zip"
          low_level_actor: "results/SingleControl/1/heading/ppo/v1/wandb/run-20240530_084912-70pgl4xt/files/actor_latest.pt"
          device: cpu
          guidance_config:
            desired_range_lag: 800.0
            desired_range_lead: 5000.0
            lag_distance: 500.0
      success_criteria:
        success_range_m: 900.0
        success_ata_deg: 25.0
        success_hold_time_s: 0.2
        hysteresis_range_m: 950.0
        hysteresis_ata_deg: 30.0

    - progress_end: 0.66
      scenario_names:
        - head_on
        - favorable
      description: "Medium: CAC tuned v2, default criteria"
      bandit_config:
        enabled: true
        controller_type: close_air_combat
        close_air_combat:
          project_root: "E:/CloseAirCombat_control"
          high_level_model: "baseline_results/checkpoints/proposed_ppo.zip"
          low_level_actor: "results/SingleControl/1/heading/ppo/v1/wandb/run-20240530_084912-70pgl4xt/files/actor_latest.pt"
          device: cpu
          guidance_config:
            desired_range_lag: 5000.0
            desired_range_lead: 12000.0
            lag_distance: 3000.0
      success_criteria:
        success_range_m: 800.0
        success_ata_deg: 22.0
        success_hold_time_s: 0.5
        hysteresis_range_m: 850.0
        hysteresis_ata_deg: 27.0

    - progress_end: 1.00
      scenario_names:
        - favorable_s3
        - head_on_s3
        - challenging_s3
        - neutral_s3
      description: "Hard: maneuver-library expert + close-range geometry, strict criteria"
      bandit_config:
        enabled: true
        controller_type: maneuver_library
        difficulty: hard
        fallback_maneuver: straight_level
        selector:
          reaction_time_s: 2.5
          selector_noise: 0.10
          min_altitude_m: 1500.0
          min_speed_mps: 120.0
          history_window: 3
          history_switch_prob: 0.6
          param_perturb_scale: 0.10
          emergency_range_m: 1000.0
          emergency_closure_mps: 80.0
          allowed_maneuvers:
            - straight_level
            - coordinated_turn
            - barrel_roll
            - dive
            - loop
            - high_yoyo
            - low_yoyo
            - scissors
            - split_s
            - immelmann
            - break_turn
            - displacement_roll
            - vertical_scissors
            - defensive_spiral
            - extension
            - jink
          situation:
            max_weapon_range_m: 8000.0
            min_weapon_range_m: 500.0
            tail_angle_thresh_deg: 30.0
      success_criteria:
        success_range_m: 700.0
        success_ata_deg: 18.0
        success_hold_time_s: 0.5
        hysteresis_range_m: 750.0
        hysteresis_ata_deg: 21.0
