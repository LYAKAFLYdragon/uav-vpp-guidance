# New, non-overlapping JSBSim corpus for the V2 retraining source.

experiment:
  name: collect_lstm_retraining_v2
  source_id: THESIS-PREDICTED-GEOMETRY-LSTM-VPP-RETRAIN-V2-20260903
  mode: data_collection
  output_root: outputs/predicted_geometry_lstm_vpp_retraining_v2/corpus

backend: jsbsim

env:
  backend: jsbsim
  use_jsbsim: true
  strict_backend: true
  aircraft_model: f16
  origin: [120.0, 60.0, 0.0]
  sim_freq: 60
  decision_freq: 5
  high_level_dt: 0.2
  low_level_dt: 0.0166667
  action_repeat: 12
  max_high_level_steps: 512
  target_mode: constant_velocity
  success_range_m: 900.0
  success_ata_deg: 25.0
  success_hold_time_s: 0.2
  hysteresis_range_m: 950.0
  hysteresis_ata_deg: 30.0
  min_altitude_m: 500.0
  max_altitude_m: 15000.0
  max_range_m: 12000.0

trajectory_prediction:
  enabled: false

virtual_point:
  anchor_mode: current_target
  action_dim: 3
  d_long_range: [-1500.0, 1500.0]
  d_lat_range: [-800.0, 800.0]
  d_vert_range: [-500.0, 500.0]
  smoothing_alpha: 0.3

guidance:
  mode: los_rate
  use_gain_adapter: false
  gains:
    k_los: 1.0
    k_pos: 0.5
    k_damp: 0.2
    k_roll: 1.0
    k_speed: 0.2
    alpha_filter: 0.3

limits:
  nz_min: -2.0
  nz_max: 7.0
  roll_rate_min: -1.5
  roll_rate_max: 1.5
  throttle_min: 0.4
  throttle_max: 0.9

collector:
  rule_mode: lead_pursuit
  seeds: [6101, 6102, 6103]
  episodes_per_scenario: 2

scenarios:
  train_head_on_high:
    name: train_head_on_high
    description: "New high-altitude, slightly displaced head-on entry."
    own_init:
      position_m: [0.0, 0.0, 5400.0]
      velocity_mps: 210.0
      heading_deg: 0.0
    target_init:
      position_m: [2400.0, 160.0, 5350.0]
      velocity_mps: 195.0
      heading_deg: 186.0
  train_head_on_low:
    name: train_head_on_low
    description: "New low-altitude, slightly displaced head-on entry."
    own_init:
      position_m: [0.0, 0.0, 4600.0]
      velocity_mps: 205.0
      heading_deg: 0.0
    target_init:
      position_m: [2600.0, -180.0, 4650.0]
      velocity_mps: 190.0
      heading_deg: 174.0
  train_cross_left:
    name: train_cross_left
    description: "New left crossing entry with altitude separation."
    own_init:
      position_m: [0.0, 0.0, 5200.0]
      velocity_mps: 215.0
      heading_deg: 4.0
    target_init:
      position_m: [1500.0, 1100.0, 5500.0]
      velocity_mps: 205.0
      heading_deg: 225.0
  train_cross_right:
    name: train_cross_right
    description: "New right crossing entry with altitude separation."
    own_init:
      position_m: [0.0, 0.0, 4800.0]
      velocity_mps: 215.0
      heading_deg: -4.0
    target_init:
      position_m: [1500.0, -1100.0, 4500.0]
      velocity_mps: 205.0
      heading_deg: 135.0
  train_neutral_offset:
    name: train_neutral_offset
    description: "New near-neutral entry with lateral and vertical offsets."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 205.0
      heading_deg: 0.0
    target_init:
      position_m: [2200.0, 500.0, 5250.0]
      velocity_mps: 198.0
      heading_deg: 171.0
  train_disadvantage_offset:
    name: train_disadvantage_offset
    description: "New rear-quarter disadvantage entry."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 205.0
      heading_deg: 0.0
    target_init:
      position_m: [-800.0, -450.0, 4950.0]
      velocity_mps: 225.0
      heading_deg: 330.0
