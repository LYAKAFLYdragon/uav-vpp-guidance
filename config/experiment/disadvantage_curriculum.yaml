# Curriculum experiment for the disadvantage feasibility gradient.
#
# Combines the base pilot config with the bridge scenarios and the v5 guidance
# protections (altitude hold + roll-angle limit) that eliminated crashes.

includes:
  - maneuver_target_pilot_base.yaml
  - disadvantage_bridge_scenarios.yaml

experiment:
  name: disadvantage_bridge_curriculum_s0

# ------------------------------------------------------------------
# VPP: use world-frame offsets, no dynamics_aware clipping.
# The clipping was shown to prevent rear-hemisphere lead turns.
# ------------------------------------------------------------------
virtual_point:
  enabled: true
  mode: normal
  anchor_mode: current_target
  action_frame: world
  return_info: true
  action_dim: 3
  d_long_range: [-1000.0, 1000.0]
  d_lat_range: [-600.0, 600.0]
  d_vert_range: [-150.0, 150.0]
  smoothing_alpha: 0.5
  dynamics_aware: false
  max_heading_rate: 0.2
  lookahead_steps: 5

# ------------------------------------------------------------------
# Guidance protections: prevent the aggressive lead-turn from rolling
# into a spiral dive.
# ------------------------------------------------------------------
guidance:
  params:
    altitude_hold:
      enabled: true
      k_alt: 0.8
      altitude_reference_m: 5000.0
      min_altitude_m: 1000.0
    roll_angle_protection:
      enabled: true
      max_roll_rad: 1.0472    # 60 deg
      attenuation_power: 2.0

# ------------------------------------------------------------------
# Reward focused on geometry, closure, and safety.
# ------------------------------------------------------------------
reward:
  w_range: 0.3
  w_angle: 0.5
  w_safety: 8.0
  w_boundary: 4.0
  w_overshoot: 1.0
  w_alive: 0.2
  w_closing: 0.5
  w_position_advantage: 0.2
  position_advantage_tail_deg: 30.0
  terminal_crash: -3000.0
  terminal_failure: -200.0
  min_altitude_m: 700.0

# ------------------------------------------------------------------
# Longer training budget because the curriculum has more stages and
# the final standard disadvantage is near the feasibility boundary.
# ------------------------------------------------------------------
ppo:
  total_timesteps: 60000
  rollout_steps: 1024
  minibatch_size: 256
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu

evaluation:
  eval_interval: 5000
  eval_episodes: 10
  eval_episodes_per_scenario: 20
  seeds: [0, 1, 2]
  save_trajectories: false

checkpoint:
  save_interval: 5000
  save_best: true
  save_last: true

# ------------------------------------------------------------------
# 5-stage curriculum.
# Stage gate is intentionally kept at 0.50; the bridge scenarios are
# designed so that early stages should pass, while the final stage
# (standard disadvantage) may require additional tuning or horizon.
# ------------------------------------------------------------------
curriculum:
  stage_gate_sr: 0.50
  stages:
    # Stage 0: learn the basic lead-turn shape in an energy-rich regime.
    - progress_end: 0.15
      scenario_names:
        - favorable
        - neutral
        - disadvantage_bridge_1
      weights:
        favorable: 1.0
        neutral: 1.0
        disadvantage_bridge_1: 3.0

    # Stage 1: transfer to a slightly harder bridge, keep bridge_1 as anchor.
    - progress_end: 0.30
      scenario_names:
        - favorable
        - neutral
        - disadvantage_bridge_1
        - disadvantage_bridge_2
      weights:
        favorable: 1.0
        neutral: 1.0
        disadvantage_bridge_1: 1.5
        disadvantage_bridge_2: 2.5

    # Stage 2: moderate lead-turn, start dropping the easiest bridge.
    - progress_end: 0.50
      scenario_names:
        - favorable
        - neutral
        - disadvantage_bridge_2
        - disadvantage_bridge_3
      weights:
        favorable: 1.0
        neutral: 1.0
        disadvantage_bridge_2: 1.5
        disadvantage_bridge_3: 2.5

    # Stage 3: narrow lead-turn, introduce near-standard geometry.
    - progress_end: 0.70
      scenario_names:
        - favorable
        - neutral
        - disadvantage_bridge_3
        - disadvantage_bridge_4
        - disadvantage_bridge_5
      weights:
        favorable: 1.0
        neutral: 1.0
        disadvantage_bridge_3: 1.0
        disadvantage_bridge_4: 2.0
        disadvantage_bridge_5: 2.0

    # Stage 4: mix near-standard bridge with the true target.
    - progress_end: 0.90
      scenario_names:
        - favorable
        - neutral
        - disadvantage_bridge_5
        - disadvantage
      weights:
        favorable: 1.0
        neutral: 1.0
        disadvantage_bridge_5: 2.0
        disadvantage: 2.5

    # Stage 5: full distribution, heavy weight on the hard scenarios.
    - progress_end: 1.0
      scenario_names:
        - favorable
        - neutral
        - disadvantage_bridge_5
        - disadvantage
        - challenging
      weights:
        favorable: 1.0
        neutral: 1.0
        challenging: 1.0
        disadvantage_bridge_5: 1.0
        disadvantage: 3.0
