# Feasibility gradient scene 1: strong energy advantage, close rear offset.
includes:
  - maneuver_target_vpp_pilot_disadvantage_focused_v5.yaml

experiment:
  name: disadvantage_gradient_1_240_180_200

ppo:
  total_timesteps: 10000

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - disadvantage_gradient_1
      weights:
        disadvantage_gradient_1: 1.0

scenarios:
  disadvantage_gradient_1:
    name: disadvantage_gradient_1
    description: "Ego 240 m/s vs target 180 m/s, 200 m rear offset. Easiest gradient point."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 240.0
      heading_deg: 0.0
    target_init:
      position_m: [-200.0, 400.0, 5000.0]
      velocity_mps: 180.0
      heading_deg: 30.0
