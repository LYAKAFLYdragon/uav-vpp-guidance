# Feasibility gradient scene 2: moderate energy advantage, 300 m rear offset.
includes:
  - maneuver_target_vpp_pilot_disadvantage_focused_v5.yaml

experiment:
  name: disadvantage_gradient_2_230_190_300

ppo:
  total_timesteps: 10000

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - disadvantage_gradient_2
      weights:
        disadvantage_gradient_2: 1.0

scenarios:
  disadvantage_gradient_2:
    name: disadvantage_gradient_2
    description: "Ego 230 m/s vs target 190 m/s, 300 m rear offset."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 230.0
      heading_deg: 0.0
    target_init:
      position_m: [-300.0, 400.0, 5000.0]
      velocity_mps: 190.0
      heading_deg: 30.0
