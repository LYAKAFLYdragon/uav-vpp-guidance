# Feasibility gradient scene 3: small energy advantage, 400 m rear offset.
includes:
  - maneuver_target_vpp_pilot_disadvantage_focused_v5.yaml

experiment:
  name: disadvantage_gradient_3_220_200_400

ppo:
  total_timesteps: 10000

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - disadvantage_gradient_3
      weights:
        disadvantage_gradient_3: 1.0

scenarios:
  disadvantage_gradient_3:
    name: disadvantage_gradient_3
    description: "Ego 220 m/s vs target 200 m/s, 400 m rear offset."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 220.0
      heading_deg: 0.0
    target_init:
      position_m: [-400.0, 400.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 30.0
