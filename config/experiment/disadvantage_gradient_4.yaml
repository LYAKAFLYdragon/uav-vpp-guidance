# Feasibility gradient scene 4: equal energy, 500 m rear offset.
includes:
  - maneuver_target_vpp_pilot_disadvantage_focused_v5.yaml

experiment:
  name: disadvantage_gradient_4_210_210_500

ppo:
  total_timesteps: 10000

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - disadvantage_gradient_4
      weights:
        disadvantage_gradient_4: 1.0

scenarios:
  disadvantage_gradient_4:
    name: disadvantage_gradient_4
    description: "Ego 210 m/s vs target 210 m/s, 500 m rear offset."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 210.0
      heading_deg: 0.0
    target_init:
      position_m: [-500.0, 400.0, 5000.0]
      velocity_mps: 210.0
      heading_deg: 30.0
