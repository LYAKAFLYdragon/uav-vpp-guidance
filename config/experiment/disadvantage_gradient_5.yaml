# Feasibility gradient scene 5: standard disadvantage, hardest point.
includes:
  - maneuver_target_vpp_pilot_disadvantage_focused_v5.yaml

experiment:
  name: disadvantage_gradient_5_200_220_600

ppo:
  total_timesteps: 10000

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - disadvantage_gradient_5
      weights:
        disadvantage_gradient_5: 1.0

scenarios:
  disadvantage_gradient_5:
    name: disadvantage_gradient_5
    description: "Ego 200 m/s vs target 220 m/s, 600 m rear offset. Standard disadvantage."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [-600.0, 400.0, 5000.0]
      velocity_mps: 220.0
      heading_deg: 30.0
