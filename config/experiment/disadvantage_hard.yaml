# Redesigned disadvantage scene (v2): front-hemisphere, large ATA, no speed advantage, low closure.
includes:
  - maneuver_target_vpp_pilot_disadvantage_focused_v5.yaml

experiment:
  name: disadvantage_hard_v2_s0

ppo:
  total_timesteps: 10000

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - disadvantage_hard
      weights:
        disadvantage_hard: 1.0

scenarios:
  disadvantage_hard:
    name: disadvantage_hard
    description: "Hard angle disadvantage. Target crosses from far left-front (ATA ~80 deg, AA ~90 deg), equal speeds."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [208.0, 1182.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 350.0
