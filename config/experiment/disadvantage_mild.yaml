# Redesigned disadvantage scene (v2): front-hemisphere, angle-unfavorable but physically solvable.
# Mild: strong speed advantage, short range, small ATA, left-front crossing.
includes:
  - maneuver_target_vpp_pilot_disadvantage_focused_v5.yaml

experiment:
  name: disadvantage_mild_v2_s0

ppo:
  total_timesteps: 10000

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - disadvantage_mild
      weights:
        disadvantage_mild: 1.0

scenarios:
  disadvantage_mild:
    name: disadvantage_mild
    description: "Mild angle disadvantage. Target crosses from left-front (ATA ~22 deg, AA ~90 deg), strong ego energy advantage."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 240.0
      heading_deg: 0.0
    target_init:
      position_m: [1000.0, 400.0, 5000.0]
      velocity_mps: 180.0
      heading_deg: 315.0
