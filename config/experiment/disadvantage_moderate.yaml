# Redesigned disadvantage scene (v2): front-hemisphere, high ATA, near feasibility boundary.
includes:
  - maneuver_target_vpp_pilot_disadvantage_focused_v5.yaml

experiment:
  name: disadvantage_moderate_v2_s0

ppo:
  total_timesteps: 10000

domain_randomization:
  scale: 0.10
  position_noise_fraction: 0.06
  velocity_noise_fraction: 0.03
  heading_noise_deg: 8.0

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - disadvantage_moderate
      weights:
        disadvantage_moderate: 1.0

scenarios:
  disadvantage_moderate:
    name: disadvantage_moderate
    description: "Moderate angle disadvantage. Target crosses from left-front (ATA ~66 deg, AA ~58 deg), target speed advantage, moderate closure."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 182.0
      heading_deg: 0.0
    target_init:
      position_m: [480.0, 1070.0, 5000.0]
      velocity_mps: 225.0
      heading_deg: 302.0
