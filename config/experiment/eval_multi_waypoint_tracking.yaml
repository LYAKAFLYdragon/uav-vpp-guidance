# Evaluation config for multi-waypoint tracking on the simple backend.
# Used for the flight-control comparison smoke tests.

includes:
  - ./compare_flight_control_base.yaml

backend: simple

task:
  name: multi_waypoint
  env_class: MultiWaypointTrackingEnv
  multi_waypoint:
    n_waypoints: 5
    waypoint_distance_range_m: [800.0, 3000.0]
    target_speed_range_mps: [100.0, 120.0]
    heading_delta_limit_deg: 30.0
    target_altitude_m: 5000.0
    reach_radius_m: 600.0
    segment_timeout_s: 20.0

env:
  backend: simple
  use_jsbsim: false
  strict_backend: false
  max_high_level_steps: 1500
