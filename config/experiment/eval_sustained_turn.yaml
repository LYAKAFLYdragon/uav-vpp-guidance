# Evaluation config for sustained turn on the simple backend.
# Used for the flight-control comparison smoke tests.

includes:
  - ./compare_flight_control_base.yaml

backend: simple

task:
  name: sustained_turn
  env_class: SustainedTurnEnv
  sustained_turn:
    target_pos_m: [2000.0, 0.0, 5000.0]
    orbit_radius_m: 1200.0
    tangent_lead_deg: 90.0
    min_safe_speed_mps: 150.0

env:
  backend: simple
  use_jsbsim: false
  strict_backend: false
  max_high_level_steps: 450
