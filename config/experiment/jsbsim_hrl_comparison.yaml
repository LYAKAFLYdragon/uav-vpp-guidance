# Minimal JSBSim comparison matrix for the HRL/VPP research mainline.
#
# Main comparison:
#   prediction_vpp vs no_prediction_vpp vs end_to_end_rl
#
# Prediction ablation:
#   perfect_prediction_vpp vs learned_prediction_vpp vs no_prediction_vpp
#   vs noisy_prediction_vpp

experiment:
  name: jsbsim_hrl_comparison
  description: "Prediction-assisted hierarchical VPP maneuver decision comparison."

opponent_stage: "none"

opponent_registry:
  expert:
    type: "rule_based"
    class: "src.uav_vpp_guidance.envs.expert_opponent.ExpertOpponent"
    config: {}

  end_to_end:
    type: "neural"
    class: "src.uav_vpp_guidance.envs.end_to_end_opponent.EndToEndOpponent"
    checkpoint: "outputs/experiments/end_to_end_ppo/checkpoints/best.pt"
    invert_observation: true
    device: "cpu"

  curriculum:
    type: "curriculum"
    stages: ["expert", "end_to_end"]
    active_stage: "end_to_end"
    switch_threshold: 0.7

run_defaults:
  backend: jsbsim
  smoke_seeds: [0]
  formal_small_seeds: [0, 1, 2]
  n_episodes: 1
  smoke_max_high_level_steps: 20
  main_methods:
    - prediction_vpp
    - no_prediction_vpp
    - end_to_end_rl
  ablation_methods:
    - perfect_prediction_vpp
    - learned_prediction_vpp
    - no_prediction_vpp
    - noisy_prediction_vpp
  tasks:
    - head_on
    - crossing_feasible
    - break_turn
    - sustained_turn

env:
  aircraft_model: f16
  origin: [120.0, 60.0, 0.0]
  sim_freq: 60
  decision_freq: 5
  high_level_dt: 0.2
  low_level_dt: 0.0166667
  action_repeat: 12
  max_high_level_steps: 512
  min_altitude_m: 500.0
  max_altitude_m: 15000.0
  max_range_m: 12000.0

low_level_controller:
  type: enhanced

guidance:
  mode: los_rate

limits:
  nz_min: -2.0
  nz_max: 7.0
  roll_rate_min: -1.5
  roll_rate_max: 1.5
  throttle_min: 0.0
  throttle_max: 1.0

observation:
  include_gains: false
  include_guidance_state: false
  include_saturation: false

attack_zone:
  enabled: false
  initial_hp: 100.0
  damage_per_step: 0.5
  legacy_range_enabled: true
  close_range_enabled: true
  close_range_min_km: 0.3
  close_range_full_score_km: 1.0
  close_range_max_km: 3.0
  close_range_score_scale: 1.0

reward:
  w_range: 0.6
  w_angle: 0.9
  w_energy: 0.0
  w_safety: 3.0
  w_saturation: 0.5
  w_smooth: 0.2
  w_turn_rate: 0.5
  w_closing: 0.1
  w_alive: 0.02
  w_overshoot: 1.0
  w_boundary: 0.3
  boundary_range_m: 6000.0
  boundary_alt_min_m: 1000.0
  boundary_alt_max_m: 9000.0
  ideal_range_min: 700.0
  ideal_range_max: 1100.0
  terminal_success: 400.0
  terminal_failure: -300.0
  terminal_crash: -600.0
  min_altitude_m: 500.0

prediction:
  learned_predictor_checkpoint: outputs/trajectory_prediction/best_model.pt
  lookahead_time_s: 1.0
  noisy_prediction_std_m: 120.0

methods:
  prediction_vpp:
    label: "Prediction VPP + HRL"
    agent_type: ppo
    checkpoint: outputs/experiments/vpp_ppo_lstm_frozen/checkpoints/best.pt
    config_path: config/experiment/train_vpp_ppo_lstm_frozen.yaml
    prediction_variant: learned

  no_prediction_vpp:
    label: "No-prediction VPP + HRL"
    agent_type: ppo
    checkpoint: outputs/experiments/no_prediction_vpp_ppo_jsbsim_compare/checkpoints/last.pt
    config_path: config/experiment/train_no_prediction_vpp_ppo_jsbsim_compare.yaml
    prediction_variant: none

  end_to_end_rl:
    label: "End-to-end RL"
    agent_type: end_to_end
    checkpoint: outputs/experiments/end_to_end_ppo/checkpoints/best.pt
    config_path: config/experiment/train_end_to_end_ppo.yaml
    prediction_variant: none

  perfect_prediction_vpp:
    label: "Perfect-prediction VPP + HRL"
    agent_type: ppo
    checkpoint: outputs/experiments/vpp_ppo_lstm_frozen/checkpoints/best.pt
    config_path: config/experiment/train_vpp_ppo_lstm_frozen.yaml
    prediction_variant: perfect

  learned_prediction_vpp:
    label: "Learned-prediction VPP + HRL"
    agent_type: ppo
    checkpoint: outputs/experiments/vpp_ppo_lstm_frozen/checkpoints/best.pt
    config_path: config/experiment/train_vpp_ppo_lstm_frozen.yaml
    prediction_variant: learned

  noisy_prediction_vpp:
    label: "Noisy-prediction VPP + HRL"
    agent_type: ppo
    checkpoint: outputs/experiments/vpp_ppo_lstm_frozen/checkpoints/best.pt
    config_path: config/experiment/train_vpp_ppo_lstm_frozen.yaml
    prediction_variant: noisy

tasks:
  head_on:
    label: "Head-on intercept"
    task:
      name: head_on
      env_class: CloseRangeTrackingEnv
      scenarios:
        - name: head_on_minimal
          own_init:
            position_m: [0.0, 0.0, 5000.0]
            velocity_mps: 200.0
            heading_deg: 0.0
          target_init:
            position_m: [2000.0, 0.0, 5000.0]
            velocity_mps: 200.0
            heading_deg: 180.0
          metadata:
            scenario_type: head_on
            frozen_set: jsbsim_hrl_minimal

  crossing_feasible:
    label: "Feasible crossing intercept"
    task:
      name: crossing_feasible
      env_class: CloseRangeTrackingEnv
      scenarios:
        - name: crossing_feasible_left_1500m
          own_init:
            position_m: [0.0, 0.0, 5000.0]
            velocity_mps: 200.0
            heading_deg: 0.0
          target_init:
            position_m: [1060.66, 1060.66, 5200.0]
            velocity_mps: 210.0
            heading_deg: 225.0
          metadata:
            scenario_type: crossing_left
            initial_range_m: 1500.0
            altitude_diff_m: 200.0
            frozen_set: jsbsim_hrl_minimal

  break_turn:
    label: "Break-turn target maneuver"
    task:
      name: break_turn
      env_class: BreakTurnEnv
      break_turn:
        maneuver_type: break_turn
        initial_range_m: 1500.0
        own_speed_mps: 280.0
        target_speed_mps: 250.0
        base_altitude_m: 5000.0
        straight_delay_s: 2.0
        turn_rate_deg_s: 6.0
        turn_angle_deg: 180.0
        min_safe_speed_mps: 150.0
        reward_shaping:
          w_range_error: 0.01
    env:
      max_high_level_steps: 450

  sustained_turn:
    label: "Sustained turn target maneuver"
    task:
      name: sustained_turn
      env_class: SustainedTurnEnv
      sustained_turn:
        target_pos_m: [2000.0, 0.0, 5000.0]
        orbit_radius_m: 1200.0
        tangent_lead_deg: 90.0
        min_safe_speed_mps: 150.0
    env:
      max_high_level_steps: 450
