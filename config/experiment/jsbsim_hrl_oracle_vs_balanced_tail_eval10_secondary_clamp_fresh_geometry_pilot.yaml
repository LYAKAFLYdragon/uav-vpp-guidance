includes:
  - ./jsbsim_hrl_oracle_task_gate_mvp.yaml
  - ./jsbsim_hrl_hierarchical_commander_mvp_2mode_task_type_mode_dominance_gated_alignment_shaped_v2_oracle_imitation_warmstart_balanced_tail_eval10_headon_reopened_crossing_leash2_secondary_clamp_lowalt_latrange_descent.yaml

experiment:
  name: jsbsim_hrl_oracle_vs_balanced_tail_eval10_secondary_clamp_fresh_geometry_pilot
  description: "Fresh geometry pilot for oracle_task_gate vs the current best commander repair using an explicit head_on/crossing scenario manifest instead of pseudo-seed replay."

run_defaults:
  smoke_seeds: [0]
  formal_small_seeds: [0]
  n_episodes: 1
  tasks:
    - head_on
    - crossing_feasible
  main_methods:
    - oracle_task_gate
    - hierarchical_commander_mvp_2mode_task_type_mode_dominance_gated_alignment_shaped_v2_oracle_imitation_warmstart_balanced_tail_eval10_headon_reopened_crossing_leash2_secondary_clamp_lowalt_latrange_descent
  ablation_methods:
    - oracle_task_gate
    - hierarchical_commander_mvp_2mode_task_type_mode_dominance_gated_alignment_shaped_v2_oracle_imitation_warmstart_balanced_tail_eval10_headon_reopened_crossing_leash2_secondary_clamp_lowalt_latrange_descent

