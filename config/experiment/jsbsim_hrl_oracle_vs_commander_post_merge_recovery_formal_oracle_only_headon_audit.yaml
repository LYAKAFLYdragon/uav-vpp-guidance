experiment:
  name: jsbsim_hrl_oracle_vs_commander_post_merge_recovery_formal_oracle_only_headon_audit
  description: "Narrow expert/head_on audit on the five oracle-only formal scenarios after specialist-loader apples-to-apples fixes."

