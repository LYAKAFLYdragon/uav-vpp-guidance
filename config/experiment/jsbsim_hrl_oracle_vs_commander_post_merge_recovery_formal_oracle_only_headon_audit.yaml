            heading_deg: 0.0
          target_init:
            position_m: [3300.0, 0.0, 4550.0]
            velocity_mps: 255.0
            heading_deg: 180.0
          metadata:
            scenario_type: head_on
            manifest_family: formal_oracle_only_audit
            initial_range_m: 3330.540497
