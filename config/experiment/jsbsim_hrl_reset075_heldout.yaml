includes:
  - ./jsbsim_hrl_combat_only_pilot.yaml

experiment:
  name: jsbsim_hrl_reset075_heldout
  description: "Formal held-out combat-only evaluation for the reset075 prediction VPP candidate."

run_defaults:
  main_methods:
    - no_prediction_vpp
    - prediction_vpp_jsbsim_compare_long_lh1p0_reset075
  tasks:
    - head_on
    - crossing_feasible

methods:
  prediction_vpp_jsbsim_compare_long_lh1p0_reset075:
    label: "Prediction VPP + HRL (JSBSim compare, lh1p0, reset075)"
    agent_type: ppo
    checkpoint: outputs/experiments/prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075/checkpoints/last.pt
    config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075.yaml
    prediction_variant: learned
