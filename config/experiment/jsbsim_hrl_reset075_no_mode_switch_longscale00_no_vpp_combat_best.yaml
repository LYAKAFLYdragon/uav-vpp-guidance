includes:
  - ./jsbsim_hrl_combat_only_pilot.yaml

experiment:
  name: jsbsim_hrl_reset075_no_mode_switch_longscale00_no_vpp_combat_best
  description: "Current Cartesian VPP baseline versus the no-VPP zero-offset PPO comparator on the shared combat-only scope."

run_defaults:
  main_methods:
    - prediction_vpp_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00
    - prediction_vpp_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_no_vpp_combat_best
  tasks:
    - head_on
    - crossing_feasible

methods:
  prediction_vpp_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00:
    label: "Cartesian VPP baseline (reset075 no mode switch longscale00)"
    agent_type: ppo
    checkpoint: outputs/experiments/prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00/checkpoints/last.pt
    config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00.yaml
    prediction_variant: learned

  prediction_vpp_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_no_vpp_combat_best:
    label: "Zero-offset / no-VPP PPO"
    agent_type: ppo
    checkpoint: outputs/experiments/prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_no_vpp_combat/checkpoints/best.pt
    config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_no_vpp_combat.yaml
    prediction_variant: none
    config_overrides:
      virtual_point.mode: zero_offset
      virtual_point.anchor_mode: current_target
      trajectory_prediction.enabled: false
