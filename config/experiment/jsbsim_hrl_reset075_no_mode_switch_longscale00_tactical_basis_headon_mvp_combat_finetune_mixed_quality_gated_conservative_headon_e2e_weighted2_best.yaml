includes:
  - ./jsbsim_hrl_combat_only_pilot.yaml

experiment:
  name: jsbsim_hrl_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_quality_gated_conservative_headon_e2e_weighted2_best
  description: "Current baseline vs end-to-end-weighted2 tactical-basis combat-finetuned best checkpoint on the shared combat-only scope."

run_defaults:
  main_methods:
    - prediction_vpp_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00
    - prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_quality_gated_conservative_headon_e2e_weighted2_best
  tasks:
    - head_on
    - crossing_feasible

methods:
  prediction_vpp_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00:
    label: "Prediction VPP + HRL (JSBSim compare, lh1p0, reset075, no mode switch, longscale00)"
    agent_type: ppo
    checkpoint: outputs/experiments/prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00/checkpoints/last.pt
    config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00.yaml
    prediction_variant: learned

  prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_quality_gated_conservative_headon_e2e_weighted2_best:
    label: "Prediction VPP + HRL (tactical basis combat finetune mixed quality-gated conservative head_on e2e-weighted2 best, reset075 no mode switch longscale00)"
    agent_type: ppo
    checkpoint: outputs/experiments/prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_quality_gated_conservative_headon_e2e_weighted2/checkpoints/best.pt
    config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_quality_gated_conservative_headon_e2e_weighted2.yaml
    prediction_variant: learned
