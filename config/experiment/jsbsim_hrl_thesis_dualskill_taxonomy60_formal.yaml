includes:
  - ./jsbsim_hrl_thesis_five_state_heldout40_v1.yaml

experiment:
  name: jsbsim_hrl_thesis_dualskill_taxonomy60_formal
  description: >
    Frozen evaluation-only Taxonomy60 comparison for the canonical dual-skill
    hierarchical VPP system. This config is formal-run capable but does not
    authorize execution by itself.

thesis_dualskill_taxonomy60_formal:
  source_id: THESIS-DUALSKILL-TAXONOMY60-3OPP-V1
  evaluation_only: true
  training_permitted: false
  tuning_permitted: false
  expected_episodes: 900
  expected_episodes_per_opponent: 300
  opponents: [expert, end_to_end, independent_ppo_vpp]
  methods:
    - fixed_head_on
    - fixed_crossing
    - static_oracle_gate
    - canonical_ppo
    - ppo_unbootstrapped_crossing
  prediction_receipt_contract:
    warmup_fallback_high_level_steps: 9
    first_required_valid_high_level_step: 10
    fallback_after_warmup_permitted: false
  jsbsim_legacy_root: E:/uav-vpp-guidance-can20260705
  jsbsim_data_manifest_sha256: 18fa1c4107fbcccb41ecdcf31e565ec5809fac16f45d1e1c006c6f691c42c10a
  stop_rule: >
    No training, tuning, scenario replacement, seed replacement, checkpoint
    replacement, reward change, VPP change, guidance change, PID change, or
    result-driven rerun is permitted.

env:
  strict_backend: true

scenario_manifest:
  path: ./manifests/thesis_dualskill_taxonomy60_v1.yaml
  source_id: THESIS-DUALSKILL-TAXONOMY60-3OPP-V1
  payload_sha256: 3b9eb214b621e03daa0dde37ea5130af53680a2f01b9a781c66709d9763f0ca4
  task_key_field: task_registry_key
  expected_task_counts:
    head_on: 48
    crossing_feasible: 12
  task_labels:
    head_on: Taxonomy60 four-geometry-quadrant envelope
    crossing_feasible: Taxonomy60 crossing-entry context envelope
  use_scenario_seed: true

methods:
  fixed_head_on:
    label: Frozen head-on VPP specialist without routing or recovery override
    agent_type: ppo
    checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_head_on_specialist_best.pt
    config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted.yaml
    prediction_variant: learned
  fixed_crossing:
    label: Frozen crossing VPP specialist without routing or recovery override
    agent_type: ppo
    checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_crossing_specialist_last.pt
    config_path: config/experiment/train_prediction_vpp_ppo_crossing_v3.yaml
    prediction_variant: learned
    observation_contract:
      checkpoint_obs_dim: 18
      include_task_type: false
    config_overrides:
      observation.include_task_type: false
  static_oracle_gate:
    label: Legacy static task gate baseline, not a dynamic taxonomy oracle
    agent_type: oracle_task_gate
    prediction_variant: learned
    specialists:
      head_on:
        specialist_key: head_on
        specialist_mode_name: head_on_specialist
        checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_head_on_specialist_best.pt
        config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted.yaml
      crossing_feasible:
        specialist_key: crossing_feasible
        specialist_mode_name: crossing_specialist
        checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_crossing_specialist_last.pt
        config_path: config/experiment/train_prediction_vpp_ppo_crossing_v3.yaml
  canonical_ppo:
    label: Frozen canonical PPO with initial-task crossing bootstrap
    agent_type: hierarchical_commander
    checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_two_skill_commander_best.pt
    config_path: config/experiment/train_prediction_vpp_hierarchical_commander_ppo_reset075_tactical_basis_3mode_post_merge_recovery_bootstrap.yaml
    prediction_variant: learned
    config_overrides:
      commander.crossing_initial_task_bootstrap.enabled: true
      commander.crossing_pre_merge_mode_lock.enabled: false
  ppo_unbootstrapped_crossing:
    label: Same frozen PPO with initial-task crossing bootstrap disabled
    agent_type: hierarchical_commander
    checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_two_skill_commander_best.pt
    config_path: config/experiment/train_prediction_vpp_hierarchical_commander_ppo_reset075_tactical_basis_3mode_post_merge_recovery_bootstrap.yaml
    prediction_variant: learned
    config_overrides:
      commander.crossing_initial_task_bootstrap.enabled: false
      commander.crossing_pre_merge_mode_lock.enabled: false

run_defaults:
  backend: jsbsim
  tasks: [head_on, crossing_feasible]
  main_methods:
    - fixed_head_on
    - fixed_crossing
    - static_oracle_gate
    - canonical_ppo
    - ppo_unbootstrapped_crossing
  ablation_methods:
    - fixed_head_on
    - fixed_crossing
    - static_oracle_gate
    - canonical_ppo
    - ppo_unbootstrapped_crossing
  seeds: [0]
  n_episodes: 1
