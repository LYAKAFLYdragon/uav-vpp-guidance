includes:
  - ./jsbsim_hrl_thesis_taxonomy_ablation30_base.yaml

experiment:
  name: noncanonical_thesis_five_state_heldout_envelope_v1
  description: >
    Independent evaluation-only five-state held-out envelope. This family does
    not train, tune, or replace the frozen canonical two-skill policy.

heldout40_protocol:
  source_id: THESIS-FIVE-STATE-HELDOUT40-V1
  evaluation_only: true
  training_permitted: false
  tuning_permitted: false
  primary_comparison: canonical_ppo_high_level_policy
  privileged_reference: legacy_static_oracle_task_gate
  fixed_controls:
    - head_on_vpp_specialist_no_routing
    - crossing_vpp_specialist_no_routing
  opponents:
    - expert
    - end_to_end
    - independent_ppo_vpp
  paired_seed_contract: scenario_seed_shared_across_methods_per_opponent
  episode_horizon_high_level_steps: 160
  high_level_dt_s: 0.2
  head_on_terminal_discriminability:
    subset_initial_class: head_on
    minimum_resolved_ratio: 0.6
    required_methods:
      - canonical_ppo_high_level_policy
    at_least_one_fixed_method:
      - head_on_vpp_specialist_no_routing
      - crossing_vpp_specialist_no_routing
    failure_label: terminal_win_rate_not_discriminative
    interpretation: >
      When this gate fails for an opponent, that opponent's head-on terminal
      win-rate is descriptive only and cannot support routing-comparison claims.
  required_episode_metrics:
    - win_loss_draw_unresolved
    - terminal_reason
    - ego_hp_target_hp_hp_advantage
    - ego_target_attack_zone_time_and_first_entry
    - ego_crash_or_out_of_bounds
    - phase_occupancy_pre_merge_post_merge_re_entry
    - dynamic_taxonomy_occupancy
    - vpp_forward_lateral_vertical_geometry
  stop_rule: >
    No training, tuning, reward/VPP/guidance/PID change, scenario replacement,
    seed replacement, result-driven rerun, or canonical-asset modification is
    permitted. Each opponent is reported separately and never pooled.

env:
  max_high_level_steps: 160
  strict_backend: true

# Preserve the frozen specialist meaning, not merely its vector length:
# head-on/canonical use base16 + gains + task bit, while crossing removes only
# the historical task bit through its method-level override (base16 + gains).
observation:
  include_gains: true
  include_opponent_stage: false
  include_task_type: true

scenario_manifest:
  path: ./manifests/thesis_five_state_heldout40_v1.yaml
  source_id: THESIS-FIVE-STATE-HELDOUT40-V1
  payload_sha256: 4ad749a29a09d4cdddcd0fd3a8dd53fb683e1c63cb466d1c73c42de5b11d74b6
  task_key_field: task_registry_key
  expected_task_counts:
    head_on: 32
    crossing_feasible: 8
  task_labels:
    head_on: "Heldout40: advantage, head-on, disadvantage, and neutral"
    crossing_feasible: "Heldout40: crossing-entry"
  use_scenario_seed: true

frozen_assets:
  source_worktree: E:/uav-vpp-guidance-thesis-five-state-v1-assets
  source_git_sha: 9a9f9bf6d68560afa81560f5260b78f318dcd9b1
