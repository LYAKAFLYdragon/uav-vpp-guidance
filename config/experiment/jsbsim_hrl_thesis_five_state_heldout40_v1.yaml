opponent_registry:
  expert:
    type: rule_based
    class: uav_vpp_guidance.envs.expert_opponent.ExpertOpponent
    config: {}
  end_to_end:
    type: neural_projected_base16
    class: uav_vpp_guidance.evaluation.feature_name_projected_opponent.FeatureNameProjectedOpponent
    checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_end_to_end_neural_opponent_best.pt
    checkpoint_sha256: d38828338d5e7e22167129b2e9972d52ecf5fc3fda5d52caff95a8374c35b8bc
    device: cpu
    config:
      delegate_class: uav_vpp_guidance.envs.end_to_end_opponent.EndToEndOpponent
      delegate_kwargs:
        invert_observation: true
      expected_feature_names:
        - range_m
        - range_rate_mps
        - altitude_diff_m
        - speed_diff_mps
        - los_azimuth_sin
        - los_azimuth_cos
        - los_elevation_sin
        - los_elevation_cos
        - ata_sin
        - ata_cos
        - aa_sin
        - aa_cos
        - own_speed
        - target_speed
        - own_altitude
        - target_altitude
  independent_ppo_vpp:
    type: continuous_vpp_projected_base16
    class: uav_vpp_guidance.evaluation.feature_name_projected_opponent.FeatureNameProjectedOpponent
    checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/independent_ppo_vpp_opponent_v1_step_32768.pt
    checkpoint_sha256: 43cd37fc86c0eb01d96a693f68d30894de7e768de01aed6dba41fa4761edfc60
    device: cpu
    config:
      delegate_class: uav_vpp_guidance.envs.vpp_ppo_opponent.VPPPPOOpponent
      expected_feature_names:
        - range_m
        - range_rate_mps
        - altitude_diff_m
        - speed_diff_mps
        - los_azimuth_sin
        - los_azimuth_cos
        - los_elevation_sin
        - los_elevation_cos
        - ata_sin
        - ata_cos
        - aa_sin
        - aa_cos
        - own_speed
        - target_speed
        - own_altitude
        - target_altitude

run_defaults:
  backend: jsbsim
  tasks:
    - head_on
    - crossing_feasible
  main_methods:
    - canonical_ppo_high_level_policy
    - legacy_static_oracle_task_gate
    - head_on_vpp_specialist_no_routing
    - crossing_vpp_specialist_no_routing
  ablation_methods:
    - canonical_ppo_high_level_policy
    - legacy_static_oracle_task_gate
    - head_on_vpp_specialist_no_routing
    - crossing_vpp_specialist_no_routing
  formal_small_seeds:
    - 0
  n_episodes: 1
