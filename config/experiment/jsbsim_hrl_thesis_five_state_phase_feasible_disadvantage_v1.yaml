  task_key_field: task_registry_key
  active_task_groups:
    - head_on
  expected_task_counts:
    head_on: 12
  task_labels:
    head_on: "Phase-feasible disadvantage: reference-only first-pass probe"
  use_scenario_seed: true

run_defaults:
  backend: jsbsim
  tasks:
    - head_on
  main_methods:
