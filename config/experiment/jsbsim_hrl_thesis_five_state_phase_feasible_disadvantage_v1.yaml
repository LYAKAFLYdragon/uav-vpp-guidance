experiment:
  name: noncanonical_thesis_five_state_phase_feasible_disadvantage_v1
  description: >
    Evaluation-only physical phase-entry probe. It preserves all frozen assets
    and evaluates only the common static oracle task-gate reference.

phase_feasible_disadvantage_protocol:
  source_id: THESIS-FIVE-STATE-PHASE-FEASIBLE-DISADVANTAGE-V1
  evaluation_only: true
  training_permitted: false
  tuning_permitted: false
  reference_controller: legacy_static_oracle_task_gate
  opponents:
    - expert
    - end_to_end
    - independent_ppo_vpp
  purpose: >
    Establish physical post-merge and re-entry reachability, not combat
    superiority, policy selection, checkpoint selection, or skill training.
  stop_rule: >
    A failed phase gate freezes negative evidence. It does not authorize
    reward, VPP, guidance, PID, scenario, seed, or checkpoint changes.

env:
  max_high_level_steps: 240
  strict_backend: true

scenario_manifest:
  path: ./manifests/thesis_five_state_phase_feasible_disadvantage_v1.yaml
  source_id: THESIS-FIVE-STATE-PHASE-FEASIBLE-DISADVANTAGE-V1
