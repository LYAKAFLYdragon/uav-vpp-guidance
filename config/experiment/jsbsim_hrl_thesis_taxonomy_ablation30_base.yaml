methods:
  canonical_ppo_high_level_policy:
    label: "Frozen canonical PPO high-level policy"
    agent_type: hierarchical_commander
    checkpoint: outputs/diagnostics/hierarchical_commander_mvp_2mode_task_type_mode_dominance_gated_alignment_shaped_v2_oracle_imitation_warmstart_balanced_tail_checkpoint_retrospective_expert_10seed_20260701_checkpoint_snapshots/best.pt
    config_path: config/experiment/train_prediction_vpp_hierarchical_commander_ppo_reset075_tactical_basis_3mode_post_merge_recovery_bootstrap.yaml
    prediction_variant: learned
  legacy_static_oracle_task_gate:
    label: "Legacy static two-skill oracle task gate"
    agent_type: oracle_task_gate
    prediction_variant: learned
    specialists:
      head_on:
        specialist_key: head_on
        specialist_mode_name: head_on_specialist
        checkpoint: outputs/experiments/prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted/checkpoints/best.pt
        config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted.yaml
      crossing_feasible:
        specialist_key: crossing_feasible
        specialist_mode_name: crossing_specialist
        checkpoint: outputs/experiments/prediction_vpp_ppo_crossing_v3/checkpoints/last.pt
        config_path: config/experiment/train_prediction_vpp_ppo_crossing_v3.yaml
  head_on_vpp_specialist_no_routing:
    label: "Frozen head-on VPP specialist without high-level routing"
    agent_type: ppo
    checkpoint: outputs/experiments/prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted/checkpoints/best.pt
    config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted.yaml
    prediction_variant: learned
  crossing_vpp_specialist_no_routing:
    label: "Frozen crossing-v3 VPP specialist without high-level routing"
    agent_type: ppo
    checkpoint: outputs/experiments/prediction_vpp_ppo_crossing_v3/checkpoints/last.pt
    config_path: config/experiment/train_prediction_vpp_ppo_crossing_v3.yaml
    prediction_variant: learned
    observation_contract:
      checkpoint_obs_dim: 18
      include_task_type: false
      rationale: "The historical crossing-v3 checkpoint predates the task-type bit; disabling it preserves the original frozen input schema."
    config_overrides:
      observation.include_task_type: false

run_defaults:
  backend: jsbsim
  tasks:
    - head_on
    - crossing_feasible
  main_methods:
    - canonical_ppo_high_level_policy
    - legacy_static_oracle_task_gate
    - head_on_vpp_specialist_no_routing
    - crossing_vpp_specialist_no_routing
  ablation_methods:
    - canonical_ppo_high_level_policy
    - legacy_static_oracle_task_gate
    - head_on_vpp_specialist_no_routing
    - crossing_vpp_specialist_no_routing
  seeds:
    - 0
  n_episodes: 1
