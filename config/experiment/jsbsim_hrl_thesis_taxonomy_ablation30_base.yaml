includes:
  - ./jsbsim_hrl_oracle_vs_commander_post_merge_recovery_formal_heldout.yaml

experiment:
  name: jsbsim_hrl_thesis_taxonomy_ablation30_base
  description: "Evaluation-only 30-scenario taxonomy ablation. Frozen canonical PPO, legacy static two-skill oracle, and two no-routing fixed-specialist controls."

thesis_taxonomy_ablation30:
  source_id: THESIS-TAXONOMY-ABLATION30-V1
  evaluation_only: true
  training_permitted: false
  tuning_permitted: false
  methods:
    - canonical_ppo_high_level_policy
    - legacy_static_oracle_task_gate
    - head_on_vpp_specialist_no_routing
    - crossing_vpp_specialist_no_routing
  oracle_mapping:
    head_on: head_on
    crossing_feasible: crossing_feasible
  fixed_controls_bypass:
    high_level_routing: true
    recovery_override: true

scenario_manifest:
  path: ./manifests/thesis_taxonomy_ablation30_v1.yaml
  source_id: THESIS-TAXONOMY-ABLATION30-V1
  payload_sha256: ff43d0ed946463ed448f0c6eba7ffdd55622b4267d7999e7cc20f1d785bb4baf
  task_key_field: task_registry_key
  expected_task_counts:
    head_on: 24
    crossing_feasible: 6
  task_labels:
    head_on: "Taxonomy ablation: advantage, head-on, disadvantage, and neutral"
    crossing_feasible: "Taxonomy ablation: crossing-entry"
  use_scenario_seed: true

