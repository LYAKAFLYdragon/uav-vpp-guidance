# Pilot base config for VPP vs No-VPP vs E2E under maneuvering target.
# The red force uses the maneuver-library expert system.

includes:
  - ../env_bandit.yaml
  - ../ppo.yaml
  - ../guidance.yaml
  - ../reward.yaml

experiment:
  name: maneuver_target_pilot
  seed: 0
  mode: train
  output_root: outputs

env:
  max_high_level_steps: 200
  high_level_dt: 0.2

  # Red force: maneuver-library expert system
  bandit:
    enabled: true
    controller_type: maneuver_library
    difficulty: medium
    fallback_maneuver: straight_level
    selector:
      reaction_time_s: 3.0
      selector_noise: 0.1
      min_altitude_m: 1500.0
      min_speed_mps: 120.0
      history_window: 3
      history_switch_prob: 0.5
      param_perturb_scale: 0.1
      emergency_range_m: 1000.0
      emergency_closure_mps: 80.0
      allowed_maneuvers:
        - straight_level
        - coordinated_turn
        - barrel_roll
        - dive
        - high_yoyo
        - low_yoyo
        - scissors
        - split_s
        - immelmann
        - break_turn
        - displacement_roll
        - vertical_scissors
        - defensive_spiral
        - extension
      situation:
        max_weapon_range_m: 8000.0
        min_weapon_range_m: 500.0
        tail_angle_thresh_deg: 30.0

  # Termination thresholds (fixed, no success-criterion curriculum for pilot)
  success_range_m: 900.0
  success_ata_deg: 25.0
  success_hold_time_s: 0.2
  hysteresis_range_m: 950.0
  hysteresis_ata_deg: 30.0

trajectory_prediction:
  enabled: false

observation:
  temporal:
    enabled: false
  include_gains: false
  include_vp_error: false
  include_scenario: false

policy:
  type: mlp
  hidden_sizes: [128, 128]
  activation: tanh
  action_dim: 3
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

ppo:
  total_timesteps: 10000
  rollout_steps: 1024
  minibatch_size: 256
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu

evaluation:
  eval_interval: 5000
  eval_episodes: 10
  seeds: [0, 1, 2]
  save_trajectories: false

checkpoint:
  save_interval: 5000
  save_best: true
  save_last: true

# Single-stage curriculum: all scenarios available from the start.
curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - favorable
        - neutral
        - disadvantage
        - challenging

scenarios:
  favorable:
    name: favorable
    description: "Ego starts behind target at close range with strong speed advantage."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 280.0
      heading_deg: 0.0
    target_init:
      position_m: [800.0, 0.0, 5000.0]
      velocity_mps: 180.0
      heading_deg: 0.0

  neutral:
    name: neutral
    description: "Ego and target start head-on at similar speed and altitude."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 180.0

  disadvantage:
    name: disadvantage
    description: "Target starts offset behind ego; ego must perform lead turn."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [-600.0, 400.0, 5000.0]
      velocity_mps: 220.0
      heading_deg: 30.0

  challenging:
    name: challenging
    description: "Target starts at high lateral offset with crossing trajectory."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 45.0
    target_init:
      position_m: [1500.0, 1500.0, 5200.0]
      velocity_mps: 210.0
      heading_deg: 225.0
