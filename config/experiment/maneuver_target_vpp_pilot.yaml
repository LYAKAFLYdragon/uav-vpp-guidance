# Pilot: VPP method under maneuvering target.
includes:
  - maneuver_target_pilot_base.yaml

experiment:
  name: maneuver_target_vpp_pilot_s0

virtual_point:
  enabled: true
  mode: normal
  anchor_mode: current_target
  return_info: true
  action_dim: 3
  # Tighten the VPP offset authority to prevent the policy from placing the
  # virtual point far below/behind the target and diving into the ground.
  d_long_range: [-1000.0, 1000.0]
  d_lat_range: [-600.0, 600.0]
  d_vert_range: [-300.0, 300.0]
  smoothing_alpha: 0.5
  dynamics_aware: true
  max_heading_rate: 0.2
  lookahead_steps: 5
