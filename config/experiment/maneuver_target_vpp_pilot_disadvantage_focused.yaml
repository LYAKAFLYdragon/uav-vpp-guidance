# Pilot: VPP with position-advantage reward and staged curriculum,
# focused on learning the disadvantage (lead-turn) scenario.
includes:
  - maneuver_target_pilot_base.yaml

experiment:
  name: maneuver_target_vpp_pilot_disadvantage_focused_s0

virtual_point:
  enabled: true
  mode: normal
  anchor_mode: current_target
  return_info: true
  action_dim: 3
  # Tight authority to avoid ground crashes while chasing maneuvering targets.
  d_long_range: [-1000.0, 1000.0]
  d_lat_range: [-600.0, 600.0]
  d_vert_range: [-300.0, 300.0]
  smoothing_alpha: 0.5
  dynamics_aware: true
  max_heading_rate: 0.2
  lookahead_steps: 5

reward:
  # Reduce range/angle weights slightly to make room for the position-advantage term.
  w_range: 0.25
  w_angle: 0.4
  w_safety: 8.0
  w_boundary: 4.0
  w_overshoot: 1.0
  w_alive: 0.2
  # New: encourage transitioning from bandit-on-tail to own-on-bandit-tail.
  w_position_advantage: 0.6
  position_advantage_tail_deg: 30.0
  terminal_crash: -3000.0
  terminal_failure: -200.0
  min_altitude_m: 700.0

ppo:
  # More steps to learn the longer-horizon position-conversion maneuver.
  total_timesteps: 30000
  rollout_steps: 1024
  minibatch_size: 256
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu

evaluation:
  eval_interval: 5000
  eval_episodes: 20
  seeds: [0, 1, 2]
  save_trajectories: false

checkpoint:
  save_interval: 5000
  save_best: true
  save_last: true

# Staged curriculum: master easy geometries first, then focus on disadvantage,
# finally mix all scenarios.
curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 0.20
      scenario_names:
        - favorable
        - neutral
    - progress_end: 0.55
      scenario_names:
        - favorable
        - neutral
        - disadvantage_easy
      weights:
        disadvantage_easy: 2.0
    - progress_end: 0.80
      scenario_names:
        - favorable
        - neutral
        - disadvantage
        - disadvantage_easy
      weights:
        disadvantage: 1.5
        disadvantage_easy: 0.5
    - progress_end: 1.0
      scenario_names:
        - favorable
        - neutral
        - disadvantage
        - challenging

scenarios:
  # Original scenarios inherited from base are re-declared here so the new
  # scenarios block is complete. Keys not listed below are taken from the base
  # through the include merge.
  favorable:
    name: favorable
    description: "Ego starts behind target at close range with strong speed advantage."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 280.0
      heading_deg: 0.0
    target_init:
      position_m: [800.0, 0.0, 5000.0]
      velocity_mps: 180.0
      heading_deg: 0.0

  neutral:
    name: neutral
    description: "Ego and target start head-on at similar speed and altitude."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 180.0

  disadvantage:
    name: disadvantage
    description: "Target starts offset behind ego; ego must perform lead turn."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [-600.0, 400.0, 5000.0]
      velocity_mps: 220.0
      heading_deg: 30.0

  disadvantage_easy:
    name: disadvantage_easy
    description: "Easier variant of disadvantage: closer, lower target speed advantage."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 210.0
      heading_deg: 0.0
    target_init:
      position_m: [-400.0, 300.0, 5000.0]
      velocity_mps: 210.0
      heading_deg: 20.0

  challenging:
    name: challenging
    description: "Target starts at high lateral offset with crossing trajectory."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 45.0
    target_init:
      position_m: [1500.0, 1500.0, 5200.0]
      velocity_mps: 210.0
      heading_deg: 225.0
