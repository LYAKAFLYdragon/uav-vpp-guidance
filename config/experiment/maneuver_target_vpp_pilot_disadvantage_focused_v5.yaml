includes:
  - maneuver_target_pilot_base.yaml

experiment:
  name: maneuver_target_vpp_pilot_disadvantage_focused_v5_s0

reward:
  w_range: 0.3
  w_angle: 0.5
  w_safety: 8.0
  w_boundary: 4.0
  w_overshoot: 1.0
  w_alive: 0.2
  w_closing: 0.5
  w_position_advantage: 0.2
  position_advantage_tail_deg: 30.0
  terminal_crash: -3000.0
  terminal_failure: -200.0
  min_altitude_m: 700.0

ppo:
  total_timesteps: 30000
  rollout_steps: 1024
  minibatch_size: 256
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu

curriculum:
  stage_gate_sr: 0.50
  stages:
    - progress_end: 1.0
      scenario_names:
        - favorable
        - neutral
        - disadvantage
        - disadvantage_easy
        - challenging
      weights:
        favorable: 1.0
        neutral: 1.0
        disadvantage: 2.0
        disadvantage_easy: 1.5
        challenging: 1.0

virtual_point:
  enabled: true
  mode: normal
  anchor_mode: current_target
  return_info: true
  action_dim: 3
  d_long_range: [-1000.0, 1000.0]
  d_lat_range: [-600.0, 600.0]
  d_vert_range: [-150.0, 150.0]
  smoothing_alpha: 0.5
  dynamics_aware: false
  max_heading_rate: 0.2
  lookahead_steps: 5

# Guidance-layer protections to keep the aircraft from crashing while it
# performs the aggressive lead-turn required by the disadvantage scenario.
guidance:
  params:
    altitude_hold:
      enabled: true
      k_alt: 0.8
      altitude_reference_m: 5000.0
      min_altitude_m: 1000.0
    roll_angle_protection:
      enabled: true
      max_roll_rad: 1.0472    # 60 deg
      attenuation_power: 2.0
