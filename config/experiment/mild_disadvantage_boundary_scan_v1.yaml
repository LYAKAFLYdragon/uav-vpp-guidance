experiment:
  name: mild_disadvantage_boundary_scan_v1
  source_id: THESIS-MILD-DISADVANTAGE-BOUNDARY-SCAN-V1-20260903
  mode: evaluation
  output_root: outputs/mild_disadvantage_boundary_scan_v1

base_config: config/experiment/simplified_scenario_feasibility_pilot_v1.yaml

scan:
  purpose: Locate the local success-to-crash boundary around disadvantage without training.
  evaluation_seed: 9701
  training_seed: 9201
  episodes_per_scenario: 1
  axes:
    rearward_offset_m:
      description: Target x position behind the own aircraft; all other target fields fixed.
      fixed_fields: [target_y_m, target_z_m, target_speed_mps, target_heading_deg]
      levels: [-150.0, -300.0, -450.0, -600.0]
    target_speed_mps:
      description: Target speed; all target position and heading fields fixed.
      fixed_fields: [target_x_m, target_y_m, target_z_m, target_heading_deg]
      levels: [200.0, 205.0, 210.0, 215.0, 220.0]
  scenarios:
    rear_offset_x150:
      axis: rearward_offset_m
      parameter_value: -150.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-150.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    rear_offset_x300:
      axis: rearward_offset_m
      parameter_value: -300.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    rear_offset_x450:
      axis: rearward_offset_m
      parameter_value: -450.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-450.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    rear_offset_x600:
      axis: rearward_offset_m
      parameter_value: -600.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-600.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    target_speed_200:
      axis: target_speed_mps
      parameter_value: 200.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 200.0, heading_deg: 20.0}
    target_speed_205:
      axis: target_speed_mps
      parameter_value: 205.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    target_speed_210:
      axis: target_speed_mps
      parameter_value: 210.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 210.0, heading_deg: 20.0}
    target_speed_215:
      axis: target_speed_mps
