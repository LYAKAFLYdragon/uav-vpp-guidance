experiment:
  name: mild_disadvantage_boundary_scan_v2
  source_id: THESIS-MILD-DISADVANTAGE-BOUNDARY-SCAN-V2-20260903
  mode: evaluation
  output_root: outputs/mild_disadvantage_boundary_scan_v2

base_config: config/experiment/simplified_scenario_feasibility_pilot_v1.yaml

scan:
  purpose: Narrow the local boundary between neutral geometry and disadvantage after v1 found no transition.
  evaluation_seed: 9702
  training_seed: 9201
  episodes_per_scenario: 1
  axes:
    rearward_offset_m:
      description: Target longitudinal position relative to own aircraft; all other target fields fixed.
      fixed_fields: [target_y_m, target_z_m, target_speed_mps, target_heading_deg]
      levels: [100.0, 50.0, 0.0, -50.0, -100.0]
    target_speed_mps:
      description: Target speed at the near-neutral longitudinal position; all other fields fixed.
      fixed_fields: [target_x_m, target_y_m, target_z_m, target_heading_deg]
      levels: [185.0, 195.0, 205.0, 215.0, 225.0]
  scenarios:
    offset_x100:
      axis: rearward_offset_m
      parameter_value: 100.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [100.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    offset_x50:
      axis: rearward_offset_m
      parameter_value: 50.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [50.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    offset_x0:
      axis: rearward_offset_m
      parameter_value: 0.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [0.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    offset_xm50:
      axis: rearward_offset_m
      parameter_value: -50.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-50.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    offset_xm100:
      axis: rearward_offset_m
      parameter_value: -100.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-100.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    speed_185:
      axis: target_speed_mps
      parameter_value: 185.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [0.0, 200.0, 5000.0], velocity_mps: 185.0, heading_deg: 20.0}
    speed_195:
      axis: target_speed_mps
      parameter_value: 195.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [0.0, 200.0, 5000.0], velocity_mps: 195.0, heading_deg: 20.0}
    speed_205:
      axis: target_speed_mps
      parameter_value: 205.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [0.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    speed_215:
      axis: target_speed_mps
      parameter_value: 215.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [0.0, 200.0, 5000.0], velocity_mps: 215.0, heading_deg: 20.0}
    speed_225:
      axis: target_speed_mps
      parameter_value: 225.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [0.0, 200.0, 5000.0], velocity_mps: 225.0, heading_deg: 20.0}

protocol:
  source_id: THESIS-MILD-DISADVANTAGE-BOUNDARY-SCAN-V2-20260903
  methods: [h0_current_geometry]
  opponents: [expert, end_to_end]
  training_started: false
