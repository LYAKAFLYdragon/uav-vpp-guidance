experiment:
  name: mild_disadvantage_boundary_scan_v3
  source_id: THESIS-MILD-DISADVANTAGE-BOUNDARY-SCAN-V3-20260903
  mode: evaluation
  output_root: outputs/mild_disadvantage_boundary_scan_v3

base_config: config/experiment/simplified_scenario_feasibility_pilot_v1.yaml

scan:
  purpose: Test whether relative target heading, rather than rearward distance or speed, creates the local disadvantage boundary.
  evaluation_seed: 9703
  training_seed: 9201
  episodes_per_scenario: 1
  axes:
    target_heading_deg:
      description: Target heading at a fixed mild-disadvantage position and speed.
      fixed_fields: [target_x_m, target_y_m, target_z_m, target_speed_mps]
      levels: [20.0, 60.0, 100.0, 140.0, 180.0, 220.0, 260.0]
  scenarios:
    heading_20:
      axis: target_heading_deg
      parameter_value: 20.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}
    heading_60:
      axis: target_heading_deg
      parameter_value: 60.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 60.0}
    heading_100:
      axis: target_heading_deg
      parameter_value: 100.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 100.0}
    heading_140:
      axis: target_heading_deg
      parameter_value: 140.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 140.0}
    heading_180:
      axis: target_heading_deg
      parameter_value: 180.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 180.0}
    heading_220:
      axis: target_heading_deg
      parameter_value: 220.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 220.0}
    heading_260:
      axis: target_heading_deg
      parameter_value: 260.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 260.0}

protocol:
  source_id: THESIS-MILD-DISADVANTAGE-BOUNDARY-SCAN-V3-20260903
  methods: [h0_current_geometry]
  opponents: [expert, end_to_end]
  training_started: false
  training_permitted: false
  backend: jsbsim
  reward_frozen: true
  action_interface_frozen: true
  low_level_frozen: true
