      target_init: {position_m: [1000.0, 200.0, 5000.0], velocity_mps: 200.0, heading_deg: 175.0}
    target_x_875:
      axis: target_x_m
      parameter_value: 875.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [875.0, 200.0, 5000.0], velocity_mps: 200.0, heading_deg: 175.0}
    target_x_750:
      axis: target_x_m
      parameter_value: 750.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [750.0, 200.0, 5000.0], velocity_mps: 200.0, heading_deg: 175.0}
    target_x_625:
      axis: target_x_m
      parameter_value: 625.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [625.0, 200.0, 5000.0], velocity_mps: 200.0, heading_deg: 175.0}
    target_x_500:
