experiment:
  name: mild_disadvantage_boundary_scan_v5
  source_id: THESIS-MILD-DISADVANTAGE-BOUNDARY-SCAN-V5-20260903
  mode: evaluation
  output_root: outputs/mild_disadvantage_boundary_scan_v5

base_config: config/experiment/simplified_scenario_feasibility_pilot_v1.yaml

scan:
  purpose: Refine the common success-to-failure bracket by adding longitudinal positions between 500 m and 1000 m while keeping the mild-neutral geometry fixed.
  evaluation_seed: 9705
  training_seed: 9201
  episodes_per_scenario: 1
  axes:
    target_x_m:
      description: Target longitudinal position; all other initial conditions remain fixed at the known mild-neutral configuration.
      fixed_fields: [target_y_m, target_z_m, target_speed_mps, target_heading_deg]
      levels: [1900.0, 1000.0, 875.0, 750.0, 625.0, 500.0, 0.0, -300.0]
  scenarios:
    target_x_1900:
      axis: target_x_m
      parameter_value: 1900.0
      own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
      target_init: {position_m: [1900.0, 200.0, 5000.0], velocity_mps: 200.0, heading_deg: 175.0}
    target_x_1000:
      axis: target_x_m
      parameter_value: 1000.0
