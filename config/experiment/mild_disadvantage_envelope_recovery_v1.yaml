experiment:
  name: mild_disadvantage_envelope_recovery_v1
  source_id: THESIS-MILD-DISADVANTAGE-ENVELOPE-RECOVERY-V1-20260903
  mode: design_only
  output_root: outputs/mild_disadvantage_envelope_recovery_v1

base_envelope_source_id: THESIS-MILD-DISADVANTAGE-CAPABILITY-ENVELOPE-V1-20260903
base_envelope_result: outputs/mild_disadvantage_capability_envelope_v1/envelope_v1/envelope_classification.csv

stable_envelope:
  coordinate_definition: target relative position in the current own-aircraft horizontal body frame; lateral coordinate uses absolute value for mirror symmetry
  stable_points_m:
    - [625.0, 100.0]
    - [625.0, 150.0]
    - [675.0, 100.0]
    - [675.0, 150.0]
    - [675.0, 200.0]
    - [725.0, 100.0]
    - [725.0, 150.0]
    - [725.0, 200.0]
    - [750.0, 100.0]
    - [750.0, 150.0]
    - [750.0, 200.0]
  x_tolerance_m: 25.0
  y_tolerance_m: 25.0

recovery_tactic:
  trigger: current relative position is outside every stable envelope cell
  nominal_mode: h0_current_geometry
  recovery_mode: crossing
  target_selection: nearest stable envelope point under normalized x/y distance
  max_recovery_steps: 48
  required_dwell_steps: 10
  target_is_intent_only: true
  does_not_teleport_state: true
  does_not_generate_vpp_action: true
  requires_envelope_condition_valid: true
  condition_validity_source: runtime adapter must confirm coordinate frame and calibrated speed/heading conditions

safety:
  min_altitude_m: 500.0
  max_range_m: 12000.0
  max_clipping_rate: 0.30
  abort_on_nonfinite: true
  abort_on_backend_fallback: true
  abort_on_terminal: true

future_probe:
  candidates:
    - {target_x_m: 625.0, target_y_m: 200.0}
    - {target_x_m: 750.0, target_y_m: 250.0}
  opponents: [expert, end_to_end]
  repetitions_per_candidate_and_opponent: 3

protocol:
  training_started: false
  training_permitted: false
  execution_authorized: false
  reward_frozen: true
  pid_frozen: true
  action_interface_frozen: true
  jsbsim_required: true
