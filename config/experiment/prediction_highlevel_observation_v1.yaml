# Independent H0/H1/H2 protocol for predicted geometry in the high-level PPO.
# This file is a design and execution entry point; it does not reuse any
# prediction_decision_bridge_v1* output directory.

experiment:
  name: prediction_highlevel_observation_v1
  source_id: THESIS-PREDICTED-GEOMETRY-HIGHLEVEL-OBSERVATION-V1
  mode: evaluation
  output_root: outputs/prediction_highlevel_observation_v1

env:
  backend: jsbsim
  strict_backend: true
  aircraft_model: f16
  origin: [120.0, 60.0, 0.0]
  sim_freq: 60
  decision_freq: 5
  high_level_dt: 0.2
  action_repeat: 12
  max_high_level_steps: 512
  target_mode: constant_velocity
  min_altitude_m: 500.0
  max_altitude_m: 15000.0
  max_range_m: 12000.0

observation:
  include_gains: false
  include_guidance_state: false
  include_saturation: false
  include_opponent_stage: false
  include_task_type: false

trajectory_prediction:
  enabled: false
  predictor_type: lstm
  strict_predictor_init: true
  checkpoint_strict: true
  checkpoint_path: outputs/trajectory_prediction/best_model.pt
  freeze_predictor_during_rl: true
  device: cpu
  allow_device_fallback: false
  model:
    type: lstm
    input_dim: 16
    hidden_dim: 128
    num_layers: 2
    dropout: 0.1
    predict_variance: false
  history:
    history_len: 10
    sample_rate_hz: 5
    padding_mode: repeat_first
  prediction:
    lookahead_time_s: 1.0
    output_mode: relative_displacement
    fallback_mode: current_target
  integration:
    anchor_mode: predicted_target
    add_prediction_to_observation: false
    add_uncertainty_to_observation: false
    replace_base_geometry: false
  normalization:
    position_scale_m: 1000.0
    velocity_scale_mps: 300.0
    angle_mode: sin_cos
    overload_scale: 9.0

guidance:
  mode: los_rate
  use_gain_adapter: false
  gains:
    k_los: 1.0
    k_pos: 0.5
    k_damp: 0.2
    k_roll: 1.0
    k_speed: 0.2
    alpha_filter: 0.3

limits:
  nz_min: -2.0
  nz_max: 7.0
  roll_rate_min: -1.5
  roll_rate_max: 1.5
  throttle_min: 0.4
  throttle_max: 0.9

policy:
  type: mlp
  hidden_sizes: [128, 128]
  activation: tanh
  action_dim: 3
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

ppo:
  total_timesteps: 200000
  rollout_steps: 2048
  device: cpu
  seed: 42

reward:
  w_range: 0.5
  w_angle: 0.8
  w_energy: 0.2
  w_safety: 2.0
  w_saturation: 1.0
  w_smooth: 0.1
  terminal_success: 200.0
  terminal_failure: -200.0
  terminal_crash: -300.0
  min_altitude_m: 500.0

opponent_registry:
  expert:
    type: rule_based
    class: src.uav_vpp_guidance.envs.expert_opponent.ExpertOpponent
    config: {}
  end_to_end:
    type: neural
    class: src.uav_vpp_guidance.envs.end_to_end_opponent.EndToEndOpponent
    checkpoint: outputs/experiments/end_to_end_ppo/checkpoints/best.pt
    invert_observation: true
    device: cpu

methods:
  h0_current_geometry:
    label: H0 current-geometry observation
    mode: h0
    checkpoint: outputs/experiments/vpp_ppo_lstm_frozen/checkpoints/best.pt
    training_allowed: false
    trajectory_prediction:
      enabled: false
      integration:
        replace_base_geometry: false
  h1_frozen_predicted_geometry:
    label: H1 frozen PPO with predicted geometry observation
    mode: h1
    checkpoint: outputs/experiments/vpp_ppo_lstm_frozen/checkpoints/best.pt
    training_allowed: false
    trajectory_prediction:
      enabled: true
      integration:
        replace_base_geometry: true
  h2_retrained_predicted_geometry:
    label: H2 retrained PPO with predicted geometry observation
    mode: h2
    checkpoint: null
    training_allowed: true
    trajectory_prediction:
      enabled: true
      integration:
        replace_base_geometry: true

scenarios:
  head_on:
    name: head_on
    description: "Head-on entry"
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 180.0
  crossing_left:
    name: crossing_left
    description: "Left crossing entry"
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [1200.0, 1200.0, 5200.0]
      velocity_mps: 210.0
      heading_deg: 225.0
  crossing_right:
    name: crossing_right
    description: "Right crossing entry"
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [1200.0, -1200.0, 5200.0]
      velocity_mps: 210.0
      heading_deg: 135.0
  neutral:
    name: neutral
    description: "Near-neutral geometry"
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [1800.0, 400.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 170.0
  disadvantage:
    name: disadvantage
    description: "Target starts behind the own aircraft"
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [-600.0, 400.0, 5000.0]
      velocity_mps: 220.0
      heading_deg: 30.0

protocol:
  source_id: THESIS-PREDICTED-GEOMETRY-HIGHLEVEL-OBSERVATION-V1
  train_seeds: [42, 43, 44]
  evaluation_seeds: [42, 43, 44]
  episodes_per_scenario: 12
  scenarios: [head_on, crossing_left, crossing_right, neutral, disadvantage]
  opponents: [expert, end_to_end]
  methods: [h0_current_geometry, h1_frozen_predicted_geometry, h2_retrained_predicted_geometry]
  predictor_future_state_access: false
  h1_updates_ppo: false
  h2_updates_only_high_level_ppo: true
  existing_bridge_outputs_forbidden: true
