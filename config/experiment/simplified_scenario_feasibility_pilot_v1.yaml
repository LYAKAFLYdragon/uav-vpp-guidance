experiment:
  name: simplified_scenario_feasibility_pilot_v1
  source_id: THESIS-SIMPLIFIED-SCENARIO-FEASIBILITY-PILOT-V1-20260903
  mode: evaluation
  output_root: outputs/simplified_scenario_feasibility_pilot_v1

env:
  backend: jsbsim
  strict_backend: true
  aircraft_model: f16
  legacy_project_root: outputs/predicted_geometry_lstm_vpp_retraining_v2/jsbsim_runtime_root
  origin: [120.0, 60.0, 0.0]
  sim_freq: 60
  decision_freq: 5
  high_level_dt: 0.2
  action_repeat: 12
  max_high_level_steps: 512
  target_mode: constant_velocity
  min_altitude_m: 500.0
  max_altitude_m: 15000.0
  max_range_m: 12000.0

observation:
  include_gains: false
  include_guidance_state: false
  include_saturation: false
  include_opponent_stage: false
  include_task_type: false

trajectory_prediction:
  enabled: false
  predictor_type: lstm
  strict_predictor_init: true
  checkpoint_strict: true
  checkpoint_path: outputs/predicted_geometry_lstm_vpp_retraining_v2/predictor_training/best_model.pt
  freeze_predictor_during_rl: true
  device: cpu
  allow_device_fallback: false
  model:
    type: lstm
    input_dim: 16
    hidden_dim: 128
    num_layers: 2
    dropout: 0.1
    predict_variance: false
  history:
    history_len: 10
    sample_rate_hz: 5
    padding_mode: repeat_first
  prediction:
    lookahead_time_s: 1.0
    output_mode: relative_displacement
    fallback_mode: current_target
  integration:
    anchor_mode: current_target
    add_prediction_to_observation: false
    add_uncertainty_to_observation: false
    replace_base_geometry: false

virtual_point:
  enabled: true
  anchor_mode: current_target
  return_info: true
  action_dim: 3
  d_long_range: [-1500.0, 1500.0]
  d_lat_range: [-800.0, 800.0]
  d_vert_range: [-500.0, 500.0]
  smoothing_alpha: 0.3

guidance:
  mode: los_rate
  use_gain_adapter: false
  gains:
    k_los: 1.0
    k_pos: 0.5
    k_damp: 0.2
    k_roll: 1.0
    k_speed: 0.2
    alpha_filter: 0.3

limits:
  nz_min: -2.0
  nz_max: 7.0
  roll_rate_min: -1.5
  roll_rate_max: 1.5
  throttle_min: 0.4
  throttle_max: 0.9

policy:
  type: mlp
  hidden_sizes: [128, 128]
  activation: tanh
  action_dim: 3
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

ppo:
  total_timesteps: 200000
  rollout_steps: 2048
  minibatch_size: 256
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu
  seed: 9201

reward:
  w_range: 0.5
  w_angle: 0.8
  w_energy: 0.2
  w_safety: 2.0
  w_saturation: 1.0
  w_smooth: 0.1
  terminal_success: 200.0
  terminal_failure: -200.0
  terminal_crash: -300.0
  min_altitude_m: 500.0

opponent_registry:
  expert:
    type: rule_based
    class: src.uav_vpp_guidance.envs.expert_opponent.ExpertOpponent
    config: {}
  end_to_end:
    type: neural
    class: src.uav_vpp_guidance.envs.end_to_end_opponent.EndToEndOpponent
    checkpoint: outputs/prediction_highlevel_h0_asset_retraining_v1/end_to_end_opponent/seed_9204/checkpoints/last.pt
    invert_observation: true
    device: cpu

methods:
  h0_current_geometry:
    label: Frozen H0 current-geometry policy
    mode: h0
    checkpoint: outputs/prediction_highlevel_h0_asset_retraining_v1/h0_current_geometry/seed_9201/checkpoints/last.pt
    training_allowed: false
    trajectory_prediction:
      enabled: false
      integration:
        replace_base_geometry: false

scenarios:
  head_on_reference:
    name: head_on_reference
    description: Reference head-on geometry retained from the formal protocol.
    difficulty_level: reference
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [2000.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 180.0}
  mild_crossing_left:
    name: mild_crossing_left
    description: Reduced lateral offset and heading difference relative to formal crossing-left.
    difficulty_level: mild
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [1600.0, 600.0, 5100.0], velocity_mps: 205.0, heading_deg: 210.0}
  mild_crossing_right:
    name: mild_crossing_right
    description: Reduced lateral offset and heading difference relative to formal crossing-right.
    difficulty_level: mild
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [1600.0, -600.0, 5100.0], velocity_mps: 205.0, heading_deg: 150.0}
  mild_neutral:
    name: mild_neutral
    description: Smaller lateral offset and near-neutral heading configuration.
    difficulty_level: mild
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [1900.0, 200.0, 5000.0], velocity_mps: 200.0, heading_deg: 175.0}
  mild_disadvantage:
    name: mild_disadvantage
    description: Reduced rearward displacement and speed advantage relative to formal disadvantage.
    difficulty_level: mild
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [-300.0, 200.0, 5000.0], velocity_mps: 205.0, heading_deg: 20.0}

protocol:
  source_id: THESIS-SIMPLIFIED-SCENARIO-FEASIBILITY-PILOT-V1-20260903
  purpose: Diagnose whether formal failures are caused by initial-scene difficulty.
  phase: pilot
  methods: [h0_current_geometry]
  opponents: [expert, end_to_end]
  scenarios: [head_on_reference, mild_crossing_left, mild_crossing_right, mild_neutral, mild_disadvantage]
  training_started: false
  training_permitted: false
  training_seed: 9201
  evaluation_seeds: [9601]
  episodes_per_scenario: 1
  formal_reference_source_id: THESIS-PREDICTED-GEOMETRY-H0-CURRENT-ASSET-PROTOCOL-V1-20260903
  low_level_frozen: true
  reward_frozen: true
  action_interface_frozen: true
  backend: jsbsim
