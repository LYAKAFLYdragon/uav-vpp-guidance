# Sparse-reward pilot experiment (R2SP-style).
#
# Replaces dense geometry shaping with sparse event/outcome rewards and
# trajectory-level relabelling.  Set reward.use_sparse: true (below) so the
# environment instantiates SparseRewardCalculator instead of RewardCalculator.

includes:
  - ../env.yaml
  - ../ppo.yaml
  - ../guidance.yaml
  - ../success_criteria/curriculum_default.yaml

experiment:
  name: sparse_reward_pilot
  seed: 0
  mode: train
  output_root: outputs

env:
  backend: simple
  use_jsbsim: false
  decision_freq: 5
  sim_freq: 60
  max_high_level_steps: 200          # timeout at 200 high-level steps
  high_level_dt: 0.2
  target_mode: constant_velocity

  # Termination thresholds
  success_range_m: 900.0
  success_ata_deg: 25.0
  success_hold_time_s: 0.2
  hysteresis_range_m: 950.0
  hysteresis_ata_deg: 30.0
  min_altitude_m: 500.0
  max_altitude_m: 15000.0
  max_range_m: 12000.0

trajectory_prediction:
  enabled: false

observation:
  temporal:
    enabled: false
    history_length: 2
    dt: 0.2
  include_gains: false
  include_vp_error: false
  include_scenario: false

# Switch the environment to the sparse reward calculator.
reward:
  use_sparse: true

sparse_reward:
  enabled: true
  terminal_success: 10.0
  terminal_crash: -10.0
  terminal_failure: -5.0

  # Proximity event: one-shot reward when the aircraft first enters this zone.
  event_range_m: 1200.0
  event_ata_deg: 45.0
  event_reward: 1.0

  # Optional continuous lock reward (per step) inside the success zone.
  lock_reward: 0.05

  # Trajectory-level relabelling kernels.
  gaussian_window: 50
  gaussian_sigma_ratio: 0.5

scenarios:
  favorable:
    name: favorable
    description: "Ego starts behind target at close range with a strong speed advantage."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 280.0
      heading_deg: 0.0
    target_init:
      position_m: [800.0, 0.0, 5000.0]
      velocity_mps: 180.0
      heading_deg: 0.0

  neutral:
    name: neutral
    description: "Ego and target start head-on at similar speed and altitude."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 180.0

  disadvantage:
    name: disadvantage
    description: "Target starts offset behind ego; ego must perform lead turn."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [-600.0, 400.0, 5000.0]
      velocity_mps: 220.0
      heading_deg: 30.0

  challenging:
    name: challenging
    description: "Target starts at high lateral offset with crossing trajectory."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 45.0
    target_init:
      position_m: [1500.0, 1500.0, 5200.0]
      velocity_mps: 210.0
      heading_deg: 225.0
