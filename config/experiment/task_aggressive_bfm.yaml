# Aggressive BFM yo-yo maneuver for smoke testing flight envelope limits.
backend: jsbsim

task:
  name: break_turn
  env_class: BreakTurnEnv
  break_turn:
    maneuver_type: yo_yo
    initial_range_m: 1500.0
    own_speed_mps: 280.0
    target_speed_mps: 250.0
    base_altitude_m: 5000.0
    altitude_amplitude_m: 1000.0
    speed_amplitude_mps: 60.0
    oscillation_freq_hz: 0.1
    min_safe_speed_mps: 150.0
    reward_shaping:
      w_range_error: 0.01

env:
  max_high_level_steps: 500
