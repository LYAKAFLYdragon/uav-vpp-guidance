task:
  name: crossing_threshold
  env_class: CloseRangeTrackingEnv
  # Deterministic crossing-angle intercept scenarios.
  # Each scenario is a single (crossing_angle, guidance_mode) condition.
  scenarios:
    - name: crossing_00deg_pn
      own_init:
        position_m: [0.0, 0.0, 5000.0]
        velocity_mps: 280.0
        heading_deg: 0.0
      target_init:
        position_m: [1000.0, 0.0, 5000.0]
        velocity_mps: 180.0
        heading_deg: 0.0
      metadata:
        crossing_angle_deg: 0.0
        guidance_mode: proportional_navigation
    - name: crossing_30deg_pn
      own_init:
        position_m: [0.0, 0.0, 5000.0]
        velocity_mps: 280.0
        heading_deg: 0.0
      target_init:
        position_m: [866.0254037844386, 500.0, 5000.0]
        velocity_mps: 180.0
        heading_deg: 30.0
      metadata:
        crossing_angle_deg: 30.0
        guidance_mode: proportional_navigation
    - name: crossing_60deg_pn
      own_init:
        position_m: [0.0, 0.0, 5000.0]
        velocity_mps: 280.0
        heading_deg: 0.0
      target_init:
        position_m: [500.0, 866.0254037844386, 5000.0]
        velocity_mps: 180.0
        heading_deg: 60.0
      metadata:
        crossing_angle_deg: 60.0
        guidance_mode: proportional_navigation
    - name: crossing_90deg_pn
      own_init:
        position_m: [0.0, 0.0, 5000.0]
        velocity_mps: 280.0
        heading_deg: 0.0
      target_init:
        position_m: [6.123233995736766e-14, 1000.0, 5000.0]
        velocity_mps: 180.0
        heading_deg: 90.0
      metadata:
        crossing_angle_deg: 90.0
        guidance_mode: proportional_navigation

guidance:
  mode: proportional_navigation

env:
  backend: jsbsim
  use_jsbsim: true
  strict_backend: true
  max_high_level_steps: 512
