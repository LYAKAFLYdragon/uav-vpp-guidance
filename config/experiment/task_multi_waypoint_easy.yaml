# Easier fly-to-waypoint task: stationary waypoints, tight reach radius.
# The aircraft must sequentially visit 5 static waypoints within 100 m.

task:
  name: multi_waypoint
  env_class: MultiWaypointTrackingEnv
  multi_waypoint:
    n_waypoints: 5
    waypoint_distance_range_m: [800.0, 3000.0]
    target_speed_range_mps: [0.0, 0.0]
    heading_delta_limit_deg: 30.0
    target_altitude_m: 5000.0
    reach_radius_m: 100.0
    segment_timeout_s: 60.0

env:
  max_high_level_steps: 1500
