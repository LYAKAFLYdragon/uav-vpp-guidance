# Task-specific configuration for nz step response.
task:
  name: nz_step_response
  env_class: NzStepResponseEnv
  nz_step_response:
    step_sequence:
      - duration_s: 2.0
        nz_cmd: 1.0
      - duration_s: 5.0
        nz_cmd: 5.0
      - duration_s: 5.0
        nz_cmd: 1.0
      - duration_s: 5.0
        nz_cmd: -1.0
      - duration_s: 3.0
        nz_cmd: 1.0
    min_safe_speed_mps: 150.0
    base_altitude_m: 5000.0
    own_speed_mps: 250.0

env:
  max_high_level_steps: 100
