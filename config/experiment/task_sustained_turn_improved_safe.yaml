# Improved sustained-turn task with safer guidance gains for baseline testing.

task:
  name: sustained_turn
  env_class: SustainedTurnEnv
  sustained_turn:
    target_pos_m: [2000.0, 0.0, 5000.0]
    orbit_radius_m: 1200.0
    tangent_lead_deg: 90.0
    min_safe_speed_mps: 150.0
    reward_shaping:
      w_radius_error: 0.5
      w_turn_rate_error: 0.5
      orbit_bonus: 50.0

env:
  max_high_level_steps: 450

guidance:
  mode: los_rate
  gains:
    k_roll: 0.3
  params:
    altitude_hold:
      enabled: true
      k_alt: 0.001
      altitude_reference_m: 5000.0
      min_altitude_m: 500.0
    roll_angle_protection:
      enabled: true
      max_roll_rad: 0.5236
      attenuation_power: 2.0
