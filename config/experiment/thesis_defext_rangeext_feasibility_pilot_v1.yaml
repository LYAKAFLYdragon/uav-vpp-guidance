    paired_intent_loss_auc20_delta_max: 0.02
decision_logic:
  new_skill_gap_supported: >
    All per-opponent contract, coverage, safety, and head-on noninferiority
    gates pass; at least two opponents pass practical improvement versus both
    head-on and the better existing specialist; the remaining opponent is no
    worse than the better existing specialist by more than 0.02.
  existing_library_routing_or_composition_gap: >
    Frozen crossing matches or outperforms the candidate on the paired primary
    metric without a safety penalty; do not claim a missing skill.
  defensive_extension_hypothesis_not_supported: >
    Candidate fails head-on geometry noninferiority or fails to show practical
    improvement in at least two opponents.
  safety_no_go: >
    Any opponent exceeds the ego crash/OOB delta gate or any fail-closed
    structural safety condition occurs.
safety_stop_rule:
  immediate_abort_on:
    - nonfinite_66d_observation
    - nonfinite_or_out_of_bounds_3d_action
    - jsbsim_backend_fallback
    - checkpoint_fallback
    - abnormal_environment_reset
    - history_padding_or_future_state_injection
  dev_abort_on:
    metric: ego_crash_oob_rate_delta_vs_frozen_fixed_head_on
    threshold: 0.05
  after_abort:
    freeze_as_negative_evidence: true
    reward_tuning: prohibited
    add_training_steps: prohibited
    replace_scenarios: prohibited
    replace_checkpoint_or_encoder: prohibited
    rerun_same_source_id: prohibited
