      config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted.yaml
    pulse_config:
      warmup_high_level_steps: 10
      intervention_high_level_steps: 20
      ramp_high_level_steps: 3
      max_action_delta: 0.35
      range_extension_extent_m: 700.0
      vertical_separation_extent_m: 300.0
      max_basis_condition_number: 100.0
  range_extension_los:
    label: Frozen head-on action plus a bounded LOS-toward-ego range-extension pulse.
    agent_type: tactical_basis_motif_specialist
    prediction_variant: learned
    motif: range_extension_los
    specialist:
      specialist_key: head_on
      specialist_mode_name: head_on_range_extension_probe
      checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_head_on_specialist_best.pt
      config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted.yaml
    pulse_config:
      warmup_high_level_steps: 10
      intervention_high_level_steps: 20
      ramp_high_level_steps: 3
      max_action_delta: 0.35
      range_extension_extent_m: 700.0
      vertical_separation_extent_m: 300.0
      max_basis_condition_number: 100.0
  vertical_separation:
    label: Frozen head-on action plus a bounded vertical-separation pulse.
    agent_type: tactical_basis_motif_specialist
    prediction_variant: learned
    motif: vertical_separation
    specialist:
      specialist_key: head_on
      specialist_mode_name: head_on_vertical_separation_probe
      checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-assets/canonical_head_on_specialist_best.pt
      config_path: config/experiment/train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k_task_type_headon_weighted.yaml
    pulse_config:
      warmup_high_level_steps: 10
      intervention_high_level_steps: 20
      ramp_high_level_steps: 3
      max_action_delta: 0.35
      range_extension_extent_m: 700.0
      vertical_separation_extent_m: 300.0
      max_basis_condition_number: 100.0

run_defaults:
  backend: jsbsim
  tasks: [head_on]
  main_methods: [fixed_head_on, fixed_crossing, lateral_break_same_side, range_extension_los, vertical_separation]
  ablation_methods: [fixed_head_on, fixed_crossing, lateral_break_same_side, range_extension_los, vertical_separation]
