source_id: THESIS-REENTRY-TERMINAL-REWARD-PILOT-V1
status: preregistered_design_only
authorization:
  execution_permitted: false
  training_permitted: false
  tuning_permitted: false
  reason: implementation_preflight_must_pass_after_v8_phase_contract
scope:
  purpose: test whether a small terminal-outcome signal improves a single reentry candidate without changing flight dynamics
  frozen_components:
    - JSBSim backend and aircraft model
    - VPP action parameterization
    - guidance law
    - PID and safety protections
    - frozen P3 temporal encoder
    - three-opponent registry
  prohibited_changes:
    - reward coefficient tuning after any pilot outcome
    - task or terminal-semantic changes
    - reset, snapshot restore, future-state injection, or history padding
    - high-level PPO or routing training
inputs:
  phase_contract_source_id: THESIS-FIVE-STATE-REENTRY-PHASE-CONTRACT-PROBE-V8
  required_phase_tracker: raw_physical_first_pass_aware_v1
  frozen_p3_encoder: E:/uav-vpp-guidance-thesis-five-state-v1-results/p3_temporal_encoder_phaseconditional_v2/checkpoints/best.pt
  frozen_p3_encoder_sha256: 385663281a9c48c0416ea4d1a1bb8dc08ed64a0cfebb0f01083cbbb8bcfbdc59
training:
  candidate: single continuous 66-D to 3-D VPP reentry policy
  baseline: frozen fixed head-on specialist
  auxiliary_baseline: frozen fixed-crossing specialist
  routing: disabled
  profile: range_extension
  opponents_reported_separately: [expert, end_to_end, independent_ppo_vpp]
  total_steps: 20000
  checkpoint_selection: fixed dev-only schedule
reward:
  base_geometry_reward:
    source: frozen_profile_weighted_geometry_progress_v1
    progress_weight: 2.0
    alignment_weight: 0.1
    physical_command_saturation_penalty: 0.05
    terminal_ego_crash_oob_penalty: 0.0
  terminal_outcome_reward:
    applies_only_on_terminal_step: true
    win_bonus: 1.0
    loss_penalty: 1.0
    draw_penalty: 0.25
    ego_crash_oob_supplemental_penalty: 1.0
    outcome_mapping:
      target_killed: win
      target_crash_or_out_of_bounds: win
      timeout_hp_advantage: win
      ego_crash_or_out_of_bounds: loss_plus_ego_crash_oob_supplement
      timeout_hp_disadvantage: loss
      timeout_draw: draw
      mutual_aircraft_failure: draw_plus_ego_crash_oob_supplement
    explicitly_not_penalized:
      - target_crash_or_out_of_bounds
      - target_killed
  formula: r = r_geometry + I(terminal) * [1.0 I(win) - 1.0 I(loss) - 0.25 I(draw) - 1.0 I(ego_crash_or_oob)]
evaluation:
  manifests: new train/dev/heldout continuous physical run-in manifests, disjoint from V1--V8
  primary: normalized reentry range-extension intent loss
  mechanisms:
    - physical reentry 66-D step count
    - range opening fraction
    - specific energy recovery
    - target and ego attack-zone exposure
  secondary: win rate with terminal-reason decomposition
  safety_stop_rule: stop and freeze as negative evidence if any JSBSim/backend/checkpoint/history contract failure or ego crash/OOB exceeds frozen head-on baseline by more than 0.05
outputs:
  root: E:/uav-vpp-guidance-five-state-heldout-envelope-v1-results/thesis_reentry_terminal_reward_pilot_v1
  paper_safe: false
