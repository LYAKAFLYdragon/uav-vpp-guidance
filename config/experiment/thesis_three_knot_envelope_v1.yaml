future_interface_metadata:
  nominal_horizon_s: 4.0
  knot_times_s: [1.0, 2.5, 4.0]
raw_action_ranges: [[-1500.0, 1500.0], [-800.0, 800.0], [-500.0, 500.0]]
candidates:
