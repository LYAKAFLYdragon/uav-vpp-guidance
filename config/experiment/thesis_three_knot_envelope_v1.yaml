  - {id: compact_escape, escape_extent_m: 150.0, connector_fraction: 0.75, opening_rate_start_mps: 0.0, opening_rate_full_mps: 80.0}
  - {id: moderate_escape, escape_extent_m: 300.0, connector_fraction: 0.50, opening_rate_start_mps: 0.0, opening_rate_full_mps: 80.0}
  - {id: balanced_escape, escape_extent_m: 600.0, connector_fraction: 0.50, opening_rate_start_mps: 0.0, opening_rate_full_mps: 80.0}
  - {id: wide_escape, escape_extent_m: 900.0, connector_fraction: 0.25, opening_rate_start_mps: 0.0, opening_rate_full_mps: 80.0}
  - {id: legacy_extent_escape, escape_extent_m: 1200.0, connector_fraction: 0.50, opening_rate_start_mps: 0.0, opening_rate_full_mps: 80.0}
gate:
