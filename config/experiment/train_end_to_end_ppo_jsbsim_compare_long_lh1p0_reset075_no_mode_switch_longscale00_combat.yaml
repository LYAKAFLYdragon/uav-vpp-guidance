includes:
  - ./train_end_to_end_ppo.yaml

experiment:
  name: end_to_end_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_combat

backend: jsbsim

env:
  backend: jsbsim
  use_jsbsim: true
  strict_backend: true
  aircraft_model: f16
  origin: [120.0, 60.0, 0.0]
  sim_freq: 60
  decision_freq: 5
  high_level_dt: 0.2
  low_level_dt: 0.0166667
  action_repeat: 12
  max_high_level_steps: 512

attack_zone:
  enabled: true
  initial_hp: 100.0
  damage_per_step: 0.5
  legacy_range_enabled: true
  close_range_enabled: true
  close_range_min_km: 0.3
  close_range_full_score_km: 1.0
  close_range_max_km: 3.0
  close_range_max_aoa_deg: 60.0
  close_range_score_scale: 1.0

reward:
  w_range: 0.6
  w_angle: 0.9
  w_energy: 0.0
  w_safety: 3.0
  w_saturation: 0.5
  w_smooth: 0.2
  w_turn_rate: 0.5
  w_closing: 0.1
  w_alive: 0.02
  w_overshoot: 1.0
  w_boundary: 0.3
  boundary_range_m: 6000.0
  boundary_alt_min_m: 1000.0
  boundary_alt_max_m: 9000.0
  ideal_range_min: 700.0
  ideal_range_max: 1100.0
  terminal_success: 400.0
  terminal_failure: -300.0
  terminal_crash: -600.0
  min_altitude_m: 500.0

scenarios:
  head_on_minimal:
    name: head_on_minimal
    description: "Frontal encounter combat proxy used for the Drones comparison MVP."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 180.0

  crossing_feasible_left_1500m:
    name: crossing_feasible_left_1500m
    description: "Crossing encounter combat proxy used for the Drones comparison MVP."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [1060.66, 1060.66, 5200.0]
      velocity_mps: 210.0
      heading_deg: 225.0
