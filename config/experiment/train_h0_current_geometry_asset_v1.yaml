# Independent current-geometry H0 asset training route.

experiment:
  name: h0_current_geometry_asset_retraining_v1
  source_id: THESIS-PREDICTED-GEOMETRY-H0-CURRENT-AND-E2E-ASSETS-V1-20260903
  seed: 9201
  mode: train
  output_root: outputs/prediction_highlevel_h0_asset_retraining_v1

backend: simple

env:
  backend: simple
  use_jsbsim: false
  strict_backend: false
  aircraft_model: f16
  origin: [120.0, 60.0, 0.0]
  sim_freq: 60
  decision_freq: 5
  high_level_dt: 0.2
  low_level_dt: 0.0166667
  action_repeat: 12
  max_high_level_steps: 512
  target_mode: constant_velocity
  success_range_m: 900.0
  success_ata_deg: 25.0
  success_hold_time_s: 0.2
  hysteresis_range_m: 950.0
  hysteresis_ata_deg: 30.0
  min_altitude_m: 500.0
  max_altitude_m: 15000.0
  max_range_m: 12000.0

observation:
  include_gains: false
  include_guidance_state: false
  include_saturation: false
  include_opponent_stage: false
  include_task_type: false

trajectory_prediction:
  enabled: false

virtual_point:
  anchor_mode: current_target
  return_info: true
  action_dim: 3
  d_long_range: [-1500.0, 1500.0]
  d_lat_range: [-800.0, 800.0]
  d_vert_range: [-500.0, 500.0]
  smoothing_alpha: 0.3

guidance:
  mode: los_rate
  use_gain_adapter: false
  gains:
    k_los: 1.0
    k_pos: 0.5
    k_damp: 0.2
    k_roll: 1.0
    k_speed: 0.2
    alpha_filter: 0.3

limits:
  nz_min: -2.0
  nz_max: 7.0
  roll_rate_min: -1.5
  roll_rate_max: 1.5
  throttle_min: 0.4
  throttle_max: 0.9

reward:
  w_range: 0.5
  w_angle: 0.8
  w_energy: 0.2
  w_safety: 2.0
  w_saturation: 1.0
  w_smooth: 0.1
  terminal_success: 200.0
  terminal_failure: -200.0
  terminal_crash: -300.0
  min_altitude_m: 500.0

policy:
  type: mlp
  hidden_sizes: [128, 128]
  activation: tanh
  action_dim: 3
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

ppo:
  total_timesteps: 200000
  rollout_steps: 2048
  minibatch_size: 256
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu

evaluation:
  eval_interval: 0
  eval_episodes: 0
  seeds: [9201, 9202, 9203]
  save_trajectories: false

checkpoint:
  save_interval: 50000
  save_best: false
  save_last: true

scenarios:
  head_on:
    name: head_on
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [2000.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 180.0}
  crossing_left:
    name: crossing_left
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [1200.0, 1200.0, 5200.0], velocity_mps: 210.0, heading_deg: 225.0}
  crossing_right:
    name: crossing_right
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [1200.0, -1200.0, 5200.0], velocity_mps: 210.0, heading_deg: 135.0}
  neutral:
    name: neutral
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [1800.0, 400.0, 5000.0], velocity_mps: 200.0, heading_deg: 170.0}
  disadvantage:
    name: disadvantage
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 200.0, heading_deg: 0.0}
    target_init: {position_m: [-600.0, 400.0, 5000.0], velocity_mps: 220.0, heading_deg: 30.0}
