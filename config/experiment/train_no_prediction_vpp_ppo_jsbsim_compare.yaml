# PPO+PID Hybrid Training — JSBSim F-16 high-fidelity backend
# PPO policy outputs 4D action: [Δx, Δy, Δz, aggressiveness]
# aggressiveness ∈ [-1, 1] scales PID gains: scale = 1.0 + agg * 0.5 → [0.5, 1.5]
# High interpretability: PPO plans trajectories (VPP), PID handles stability.
# Moderate training cost: action_dim=4, only 33% more than baseline action_dim=3.

includes:
  - ../env.yaml
  - ../ppo.yaml
  - ../guidance.yaml
  - ../reward.yaml
  - ../success_criteria/curriculum_default.yaml

experiment:
  name: no_prediction_vpp_ppo_jsbsim_compare
  seed: 0
  mode: train
  output_root: outputs

backend: jsbsim

env:
  backend: jsbsim
  use_jsbsim: true
  strict_backend: true
  aircraft_model: f16
  origin: [120.0, 60.0, 0.0]

  sim_freq: 60
  decision_freq: 5
  high_level_dt: 0.2
  low_level_dt: 0.0166667
  action_repeat: 12
  max_high_level_steps: 512

  target_mode: constant_velocity

trajectory_prediction:
  enabled: false

virtual_point:
  anchor_mode: current_target
  return_info: true
  action_dim: 3
  d_long_range: [-1500.0, 1500.0]
  d_lat_range: [-800.0, 800.0]
  d_vert_range: [-500.0, 500.0]
  smoothing_alpha: 0.3
  dynamics_aware: true
  max_heading_rate: 0.3
  lookahead_steps: 5

observation:
  temporal:
    enabled: false
    history_length: 2
    dt: 0.2
  include_gains: false
  include_vp_error: false
  include_scenario: false

guidance:
  mode: los_rate
  use_gain_adapter: false
  gains:
    k_los: 1.0
    k_pos: 0.5
    k_damp: 0.2
    k_roll: 1.0
    k_speed: 0.2
    alpha_filter: 0.3
  params:
    altitude_hold:
      enabled: false
      k_alt: 0.002
      altitude_reference_m: 5000.0
      min_altitude_m: 500.0
    roll_angle_protection:
      enabled: true
      max_roll_rad: 1.3963
      attenuation_power: 2.0
    use_distance_aware_speed: true

limits:
  nz_min: -2.0
  nz_max: 7.0
  roll_rate_min: -1.5
  roll_rate_max: 1.5
  throttle_min: 0.0
  throttle_max: 1.0

low_level_controller:
  type: enhanced

reward:
  w_range: 0.6
  w_angle: 0.9
  w_energy: 0.0
  w_safety: 3.0
  w_saturation: 0.5
  w_smooth: 0.2
  w_turn_rate: 0.5
  w_closing: 0.1
  w_alive: 0.02
  w_overshoot: 1.0
  w_boundary: 0.3
  boundary_range_m: 6000.0
  boundary_alt_min_m: 1000.0
  boundary_alt_max_m: 9000.0
  ideal_range_min: 700.0
  ideal_range_max: 1100.0
  terminal_success: 400.0
  terminal_failure: -300.0
  terminal_crash: -600.0
  min_altitude_m: 500.0

policy:
  type: mlp
  hidden_sizes: [128, 128]
  activation: tanh
  action_dim: 3
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

ppo:
  total_timesteps: 200000
  rollout_steps: 2048
  minibatch_size: 256
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu

evaluation:
  eval_interval: 10000
  eval_episodes: 10
  seeds: [0, 1, 2]
  save_trajectories: true

checkpoint:
  save_interval: 10000
  save_best: true
  save_last: true

scenarios:
  favorable:
    name: favorable
    description: "Ego starts behind target at close range with strong speed advantage."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 280.0
      heading_deg: 0.0
    target_init:
      position_m: [800.0, 0.0, 5000.0]
      velocity_mps: 180.0
      heading_deg: 0.0

  neutral:
    name: neutral
    description: "Ego and target start head-on at similar speed and altitude."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 180.0

  disadvantage:
    name: disadvantage
    description: "Target starts offset behind ego; ego must perform lead turn."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [-600.0, 400.0, 5000.0]
      velocity_mps: 220.0
      heading_deg: 30.0

  challenging:
    name: challenging
    description: "Target starts at high lateral offset with crossing trajectory."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 45.0
    target_init:
      position_m: [1500.0, 1500.0, 5200.0]
      velocity_mps: 210.0
      heading_deg: 225.0
