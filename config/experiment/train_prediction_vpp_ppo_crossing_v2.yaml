includes:
  - ./train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_tactical_basis_headon_mvp_combat_finetune_mixed_opponent_aware_32k.yaml

experiment:
  name: prediction_vpp_ppo_crossing_v2

combat_finetune:
  task_weights:
    head_on: 1.0
    crossing_feasible: 2.0
  # Lane-aware checkpoint selection: primary goal = expert/crossing_feasible win rate
  selection_metric:
    mode: lane_gated
    objective: "crossing_feasible::expert.win_rate"
    fallback_metric: "overall.mean_return"
    gate_bonus: 1000000.0
    gates:
      - task: crossing_feasible
        opponent_stage: expert
        metric: win_rate
        min_value: 0.0

ppo:
  total_timesteps: 65536

evaluation:
  eval_interval: 8192

checkpoint:
  save_interval: 8192

reward:
  # Crossing v2: add explicit attack-zone envelope reward signal
  w_attack_zone: 0.5
  attack_zone_score_scale: 1.0
  # Keep existing weights
  w_range: 0.6
  w_angle: 0.9
  w_energy: 0.0
  w_safety: 3.0
  w_saturation: 0.5
  w_smooth: 0.2
  w_turn_rate: 0.5
  w_closing: 0.1
  w_alive: 0.02
  w_overshoot: 1.0
  w_boundary: 0.3
