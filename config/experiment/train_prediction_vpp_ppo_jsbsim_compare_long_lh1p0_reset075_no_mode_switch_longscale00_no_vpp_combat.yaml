includes:
  - ./train_prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00.yaml

experiment:
  name: prediction_vpp_ppo_jsbsim_compare_long_lh1p0_reset075_no_mode_switch_longscale00_no_vpp_combat

trajectory_prediction:
  enabled: false

virtual_point:
  mode: zero_offset
  anchor_mode: current_target
  return_info: true

attack_zone:
  enabled: true
  initial_hp: 100.0
  damage_per_step: 0.5
  legacy_range_enabled: true
  close_range_enabled: true
  close_range_min_km: 0.3
  close_range_full_score_km: 1.0
  close_range_max_km: 3.0
  close_range_max_aoa_deg: 60.0
  close_range_score_scale: 1.0

scenarios:
  head_on_minimal:
    name: head_on_minimal
    description: "Frontal encounter combat proxy used for the Drones comparison MVP."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [2000.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 180.0

  crossing_feasible_left_1500m:
    name: crossing_feasible_left_1500m
    description: "Crossing encounter combat proxy used for the Drones comparison MVP."
    own_init:
      position_m: [0.0, 0.0, 5000.0]
      velocity_mps: 200.0
      heading_deg: 0.0
    target_init:
      position_m: [1060.66, 1060.66, 5200.0]
      velocity_mps: 210.0
      heading_deg: 225.0
