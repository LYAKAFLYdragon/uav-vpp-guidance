schema_version: 1
experiment:
  name: thesis_five_state_shared_skills_combat_v1
  lane: noncanonical_thesis_extension
  family: thesis_five_state_shared_intent_v1
  stage: p4_combat_finetune
  execution_mode: readiness_only
  training_permitted: false
  high_level_ppo_training: prohibited
  reason: P4_readiness_patch_must_not_launch_training
sources:
  skill_registry: config/experiment/thesis_five_state_shared_skill_registry_v1.yaml
  geometry_pretrain_config: config/experiment/train_thesis_five_state_shared_skills_geometry_v1.yaml
  observation_contract: config/experiment/thesis_five_state_shared_intent_v1_observation_contract.yaml
  profiles: config/experiment/thesis_five_state_shared_intent_v1_profiles.yaml
  opponent_registry: config/experiment/thesis_five_state_shared_intent_v1_opponent_registry.yaml
  asset_manifest: reports/thesis_five_state_shared_intent_v1_asset_manifest.yaml
  output_retention: config/experiment/thesis_five_state_shared_intent_v1_output_retention.yaml
  train_distribution: config/experiment/thesis_five_state_shared_intent_v1_train_distribution.yaml
  dev30_manifest: config/experiment/manifests/thesis_five_state_shared_intent_v1_dev30.yaml
  heldout60_manifest: config/experiment/manifests/thesis_five_state_shared_intent_v1_heldout60.yaml
encoder:
  checkpoint: E:/uav-vpp-guidance-thesis-five-state-v1-results/p3_temporal_encoder_phaseconditional_v2/checkpoints/best.pt
  sha256: 385663281a9c48c0416ea4d1a1bb8dc08ed64a0cfebb0f01083cbbb8bcfbdc59
  input_base_geometry_dim: 16
  history_window_steps: 10
  embedding_dim: 32
  trainable: false
  fallback: prohibited
observation_action_contract:
  observation_dim: 66
  profile_conditioned_segments: [intent_targets, intent_weights]
  action_dim: 3
  action_components: [forward_bias_normalized, lateral_bias_normalized, vertical_bias_normalized]
  implicit_padding_or_truncation: prohibited
  checkpoint_fallback: prohibited
runtime:
  simulator: JSBSim
  strict_backend: true
  legacy_project_root: E:/uav-vpp-guidance-thesis-five-state-v1-jsbsim-v1.1.6
  aircraft_model: f16
  high_level_dt_s: 0.2
  predicted_target_vpp_interface: frozen
  guidance_pid: frozen_existing_chain
  prediction_reward: prohibited
  trajectory_prediction:
    enabled: true
    predictor_type: lstm
    checkpoint_path: E:/uav-vpp-guidance-thesis-five-state-v1-assets/frozen_trajectory_predictor_best_model.pt
    strict_predictor_init: true
    checkpoint_strict: true
    freeze_predictor_during_rl: true
    device: cpu
    model:
      type: lstm
      input_dim: 16
      hidden_dim: 128
      num_layers: 2
      dropout: 0.1
      predict_variance: false
    history:
      history_len: 10
      sample_rate_hz: 5
      padding_mode: repeat_first
      padding_scope: frozen_predictor_interface_only_not_p4_policy_contract
    prediction:
      lookahead_time_s: 1.0
      output_mode: relative_displacement
      fallback_mode: constant_velocity
    integration:
      anchor_mode: predicted_target
      add_prediction_to_observation: false
      add_uncertainty_to_observation: false
    normalization:
      position_scale_m: 1000.0
      velocity_scale_mps: 300.0
      angle_mode: sin_cos
      overload_scale: 9.0
  virtual_point:
    anchor_mode: predicted_target
    action_dim: 3
    d_long_range: [-1500.0, 1500.0]
    d_lat_range: [-800.0, 800.0]
    d_vert_range: [-500.0, 500.0]
    smoothing_alpha: 0.3
combat_sampling:
  opponent_registry_source: thesis_five_state_shared_intent_v1_opponents_v1
  strategy: balanced_round_robin
  opponents: [expert_rule_based, end_to_end_neural, independent_ppo_vpp]
  missing_or_failed_opponent: fail_closed
  report_each_opponent_separately: true
  aggregate_opponents: prohibited
skills:
  require_geometry_pretrain_checkpoint_for_each_skill: true
  train_all: [pursuit_conversion, lead_intercept, defensive_extension, reentry_recovery]
  freeze_after_dev30_selection: required_after_authorization
selection:
  split: dev30
  heldout60_use: prohibited
  required_metrics_after_authorization:
    - intent_direction_agreement
    - jsbsim_crash_oob_delta_vs_two_skill_baseline
    - responsibility_aligned_geometry_progress
    - terminal_mix
outputs:
  root: E:/uav-vpp-guidance-thesis-five-state-v1-results/p4_shared_skills_combat_v1
  must_be_fresh_and_empty: true
  checkpoint_retention_top_k: 3
  train_full_raw_telemetry: prohibited
stop_rule:
  on_readiness_failure: do_not_train_fix_only_named_contract_layer
  on_two_or_more_skill_readiness_failures: do_not_start_high_level_ppo
