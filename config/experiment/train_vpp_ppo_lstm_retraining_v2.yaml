# Independent full LSTM-predictor + VPP-PPO training configuration.

experiment:
  name: vpp_ppo_lstm_retraining_v2
  source_id: THESIS-PREDICTED-GEOMETRY-LSTM-VPP-RETRAIN-V2-20260903
  seed: 6101
  mode: train
  output_root: outputs/predicted_geometry_lstm_vpp_retraining_v2

backend: simple

env:
  backend: simple
  use_jsbsim: false
  strict_backend: false
  aircraft_model: f16
  origin: [120.0, 60.0, 0.0]
  sim_freq: 60
  decision_freq: 5
  high_level_dt: 0.2
  low_level_dt: 0.0166667
  action_repeat: 12
  max_high_level_steps: 512
  target_mode: constant_velocity
  success_range_m: 900.0
  success_ata_deg: 25.0
  success_hold_time_s: 0.2
  hysteresis_range_m: 950.0
  hysteresis_ata_deg: 30.0
  min_altitude_m: 500.0
  max_altitude_m: 15000.0
  max_range_m: 12000.0

observation:
  include_gains: false
  include_guidance_state: false
  include_saturation: false
  include_opponent_stage: false
  include_task_type: false

trajectory_prediction:
  enabled: true
  predictor_type: lstm
  checkpoint_path: outputs/predicted_geometry_lstm_vpp_retraining_v2/predictor_training/best_model.pt
  strict_predictor_init: true
  checkpoint_strict: true
  device: cpu
  allow_device_fallback: false
  freeze_predictor_during_rl: true
  model:
    type: lstm
    input_dim: 16
    hidden_dim: 128
    num_layers: 2
    dropout: 0.1
    predict_variance: false
  history:
    history_len: 10
    sample_rate_hz: 5
    padding_mode: repeat_first
    allow_neural_padding: true
  prediction:
    lookahead_time_s: 1.0
    output_mode: relative_displacement
    fallback_mode: none
  integration:
    anchor_mode: predicted_target
    add_prediction_to_observation: false
    add_uncertainty_to_observation: false
  normalization:
    position_scale_m: 1000.0
    velocity_scale_mps: 300.0
    angle_mode: sin_cos
    overload_scale: 9.0

virtual_point:
  anchor_mode: predicted_target
  return_info: true
  action_dim: 3
  d_long_range: [-1500.0, 1500.0]
  d_lat_range: [-800.0, 800.0]
  d_vert_range: [-500.0, 500.0]
  smoothing_alpha: 0.3

guidance:
  mode: los_rate
  use_gain_adapter: false
  gains:
    k_los: 1.0
    k_pos: 0.5
    k_damp: 0.2
    k_roll: 1.0
    k_speed: 0.2
    alpha_filter: 0.3

limits:
  nz_min: -2.0
  nz_max: 7.0
  roll_rate_min: -1.5
  roll_rate_max: 1.5
  throttle_min: 0.4
  throttle_max: 0.9

reward:
  w_range: 0.5
  w_angle: 0.8
  w_energy: 0.2
  w_safety: 2.0
  w_saturation: 1.0
  w_smooth: 0.1
  terminal_success: 200.0
  terminal_failure: -200.0
  terminal_crash: -300.0
  min_altitude_m: 500.0

policy:
  type: mlp
  hidden_sizes: [128, 128]
  activation: tanh
  action_dim: 3
  action_low: [-1.0, -1.0, -1.0]
  action_high: [1.0, 1.0, 1.0]

ppo:
  total_timesteps: 200000
  rollout_steps: 2048
  minibatch_size: 256
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  normalize_advantage: true
  device: cpu

training_contract:
  backend: simple
  rationale: "Keep full PPO training computationally feasible; formal evaluation remains strict JSBSim."

evaluation:
  eval_interval: 0
  eval_episodes: 0
  seeds: [6101, 6102, 6103]
  save_trajectories: false

checkpoint:
  save_interval: 50000
  save_best: false
  save_last: true

scenarios:
  train_head_on_high:
    name: train_head_on_high
    own_init: {position_m: [0.0, 0.0, 5400.0], velocity_mps: 210.0, heading_deg: 0.0}
    target_init: {position_m: [2400.0, 160.0, 5350.0], velocity_mps: 195.0, heading_deg: 186.0}
  train_head_on_low:
    name: train_head_on_low
    own_init: {position_m: [0.0, 0.0, 4600.0], velocity_mps: 205.0, heading_deg: 0.0}
    target_init: {position_m: [2600.0, -180.0, 4650.0], velocity_mps: 190.0, heading_deg: 174.0}
  train_cross_left:
    name: train_cross_left
    own_init: {position_m: [0.0, 0.0, 5200.0], velocity_mps: 215.0, heading_deg: 4.0}
    target_init: {position_m: [1500.0, 1100.0, 5500.0], velocity_mps: 205.0, heading_deg: 225.0}
  train_cross_right:
    name: train_cross_right
    own_init: {position_m: [0.0, 0.0, 4800.0], velocity_mps: 215.0, heading_deg: -4.0}
    target_init: {position_m: [1500.0, -1100.0, 4500.0], velocity_mps: 205.0, heading_deg: 135.0}
  train_neutral_offset:
    name: train_neutral_offset
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 205.0, heading_deg: 0.0}
    target_init: {position_m: [2200.0, 500.0, 5250.0], velocity_mps: 198.0, heading_deg: 171.0}
  train_disadvantage_offset:
    name: train_disadvantage_offset
    own_init: {position_m: [0.0, 0.0, 5000.0], velocity_mps: 205.0, heading_deg: 0.0}
    target_init: {position_m: [-800.0, -450.0, 4950.0], velocity_mps: 225.0, heading_deg: 330.0}
